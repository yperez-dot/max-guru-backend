    const onMove = (e) => setSidebarWidth(Math.min(MAX_SIDEBAR, Math.max(MIN_SIDEBAR, e.clientX)));
    const onUp = () => setIsDragging(false);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, [isDragging]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "/" && document.activeElement !== inputRef.current && !e.metaKey && !e.ctrlKey && !e.altKey) {
        const tag = (document.activeElement && document.activeElement.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        e.preventDefault();
        inputRef.current?.focus();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const collapsed = !isMobile && sidebarWidth < 140;

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  const nowLabel = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

  const resetChatSession = (opts) => {
    const keepWorkup = opts && opts.keepWorkup;
    if (autoSaveTimerRef.current) {
      clearTimeout(autoSaveTimerRef.current);
      autoSaveTimerRef.current = null;
    }
    chatGenRef.current += 1;
    clearQueued();
    if (!keepWorkup) {
      loadedWorkupRef.current = null;
      currentWorkupIdRef.current = null;
      setCurrentWorkupId(null);
      lastComparisonExportRef.current = null;
      lastSavedSigRef.current = "";
    }
    setMessages([]);
    messagesRef.current = [];
    setBanners([]);
    setError(null);
    setInput("");
    setPendingImages([]);
    setAttachError(null);
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const loadWorkups = async () => {
    if (!getAccessToken() && accessGateOn) return;
    setWorkupsLoading(true);
    try {
      const data = await workupsRequest("GET", "");
      setWorkups(Array.isArray(data.workups) ? data.workups : []);
      setWorkupNotice(null);
    } catch (err) {
      if (err && err.code === "access_required") {
        setUnlocked(false);
        setGateError("Session expired — sign in with your email and password again.");
        return;
      }
      setWorkupNotice(err.message || "Could not load saved workups.");
    } finally {
      setWorkupsLoading(false);
    }
  };

  useEffect(() => {
    if (!unlocked) return;
    void loadWorkups();
  }, [unlocked]);

  const buildWorkupBody = (payload) => {
    const extras = {
      id: currentWorkupIdRef.current || undefined,
      threadText: window.MaxComparisonExport.conversationPlainText(messagesRef.current, userMessageText),
      clientName: payload && payload.clientName,
      terminatingPlan: payload && payload.terminatingPlan,
    };
    const built = window.MaxClientWorkups.buildWorkupFromExport(payload, extras);
    const prev = loadedWorkupRef.current;
    if (prev) {
      if (!built.clientName) built.clientName = prev.clientName || "";
      if (!built.zip) built.zip = prev.zip || "";
      if (!built.county) built.county = prev.county || "";
      if (!built.contacts) built.contacts = prev.contacts || "";
      if (!built.terminatingPlan) built.terminatingPlan = prev.terminatingPlan || "";
      if (!built.needs.length && Array.isArray(prev.needs)) built.needs = prev.needs;
      if (!built.doctors.length && Array.isArray(prev.doctors)) built.doctors = prev.doctors;
      if (!built.medications.length && Array.isArray(prev.medications)) built.medications = prev.medications;
    }
    return built;
  };

  const saveWorkup = async (payload, opts) => {
    const silent = opts && opts.silent;
    const src = payload || lastComparisonExportRef.current;
    if (!src || !Array.isArray(src.plans) || src.plans.length < 2) {
      if (!silent) setWorkupNotice("Compare 2+ plans first, then save.");
      return null;
    }
    const body = buildWorkupBody(src);
    const sig = JSON.stringify({
      id: body.id || "",
      clientName: body.clientName,
      zip: body.zip,
      county: body.county,
      contacts: body.contacts,
      planIds: body.planIds,
      doctors: body.doctors,
      medications: body.medications,
      needs: body.needs,
      terminatingPlan: body.terminatingPlan,
    });
    if (silent && sig === lastSavedSigRef.current) return loadedWorkupRef.current;
    if (!silent) setSavingWorkup(true);
    try {
      const data = await workupsRequest("PUT", body.id ? "/" + body.id : "", body);
      const workup = data.workup;
      loadedWorkupRef.current = workup;
      currentWorkupIdRef.current = workup.id;
      setCurrentWorkupId(workup.id);
      lastSavedSigRef.current = sig;
      setWorkups((current) => {
        const summary = {
          id: workup.id,
          clientName: workup.clientName,
          zip: workup.zip,
          county: workup.county,
          planIds: workup.planIds,
          planLabels: (workup.plans || []).map((p) => `${p.carrier || ""} ${p.planName || ""}`.trim() + ` (${p.planId})`),
          updatedAt: workup.updatedAt,
        };
        const rest = (current || []).filter((w) => w.id !== workup.id);
        return [summary, ...rest];
      });
      if (!silent) setWorkupNotice("Saved — same list on phone and desktop.");
      return workup;
    } catch (err) {
      if (err && err.code === "access_required") {
        setUnlocked(false);
        setGateError("Session expired — sign in with your email and password again.");
        return null;
      }
      if (!silent) setWorkupNotice(err.message || "Could not save workup.");
      return null;
    } finally {
      if (!silent) setSavingWorkup(false);
    }
  };

  const scheduleAutoSave = (payload) => {
    if (!payload || !payload.plans || payload.plans.length < 2) return;
    if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
    autoSaveTimerRef.current = setTimeout(() => { void saveWorkup(payload, { silent: true }); }, 700);
  };

  const openWorkup = async (id) => {
    try {
      const data = await workupsRequest("GET", "/" + id);
      const workup = data.workup;
      const payload = window.MaxClientWorkups.workupToExportPayload(workup, PLANS);
      resetChatSession({ keepWorkup: true });
      loadedWorkupRef.current = workup;
      currentWorkupIdRef.current = workup.id;
      setCurrentWorkupId(workup.id);
      lastComparisonExportRef.current = payload;
      lastSavedSigRef.current = JSON.stringify({
        id: workup.id,
        clientName: workup.clientName,
        zip: workup.zip,
        county: workup.county,
        contacts: workup.contacts,
        planIds: workup.planIds,
        doctors: workup.doctors,
        medications: workup.medications,
        needs: workup.needs,
        terminatingPlan: workup.terminatingPlan,
      });
      const card = { role: "workup", workup, time: nowLabel() };
      const next = [card];
      if (payload.plans && payload.plans.length >= 2) {
        next.push({
          role: "offer",
          content: "export",
          plans: payload.plans,
          clientName: payload.clientName,
          terminatingPlan: payload.terminatingPlan,
          doctors: payload.doctors,
          drugs: payload.drugs,
          time: nowLabel(),
        });
      }
      messagesRef.current = next;
      setMessages(next);
      setWorkupNotice(null);
      if (isMobile) setSidebarOpen(false);
      setTimeout(() => inputRef.current?.focus(), 50);
    } catch (err) {
      if (err && err.code === "access_required") {
        setUnlocked(false);
        setGateError("Session expired — sign in with your email and password again.");
        return;
      }
      setWorkupNotice(err.message || "Could not open workup.");
    }
  };

  const deleteWorkup = async (id, clientLabel) => {
    const label = clientLabel || "this workup";
    if (!window.confirm("Delete saved workup for " + label + "?")) return;
    try {
      await workupsRequest("DELETE", "/" + id);
      setWorkups((current) => (current || []).filter((w) => w.id !== id));
      if (currentWorkupIdRef.current === id) {
        loadedWorkupRef.current = null;
        currentWorkupIdRef.current = null;
        setCurrentWorkupId(null);
      }
    } catch (err) {
      if (err && err.code === "access_required") {
        setUnlocked(false);
        return;
      }
      setWorkupNotice(err.message || "Could not delete workup.");
    }
  };

  const startNewChat = () => {
    resetChatSession();
    if (isMobile) setSidebarOpen(false);
    setTimeout(() => inputRef.current?.focus(), 50);
  };

  const copyLink = async () => {
    try {
      const preferred = "https://max.healthexps.com/";
      await navigator.clipboard.writeText(preferred);
      setCopied(true);
      setTimeout(() => setCopied(false), 1600);
    } catch (_) {
      setCopied(false);
    }
  };

  const submitUnlock = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const email = gateEmail.trim();
    const pw = gatePassword.trim();
    if (!email || !pw || gateLoading) return;
    setGateLoading(true);
    setGateError(null);
    try {
      await unlockMax(email, pw);
      setUnlocked(true);
      setGatePassword("");
      setTimeout(() => inputRef.current?.focus(), 50);
    } catch (err) {
      const msg =
        err.status === 401
          ? (String(err.message || "").toLowerCase().includes("email") ? "Email not authorized." : "Wrong password.")
          : (err.message || "Couldn’t unlock Max.");
      setGateError(msg);
    } finally {
      setGateLoading(false);
    }
  };

  const lockMax = () => {
    resetChatSession();
    setAccessToken("");
    setUnlocked(false);
    setWorkups([]);
    setWorkupNotice(null);
  };

  const addPendingFiles = async (fileList) => {
    const files = [...(fileList || [])].filter(Boolean);
    if (!files.length) return;
    const next = [...pendingImages];
    let nextError = null;
    for (const file of files) {
      if (next.length >= MAX_ATTACH_IMAGES) {
        nextError = "You can attach up to 4 images per message.";
        break;
      }
      const type = file.type === "image/jpg" ? "image/jpeg" : file.type;
      if (!ALLOWED_ATTACH_TYPES.includes(type)) {
        nextError = attachTypeError();
        continue;
      }
      if (file.size > MAX_ATTACH_BYTES) {
        nextError = attachSizeError();
        continue;
      }
      try {
        const dataUrl = await readFileAsDataUrl(file);
        next.push({
          id: `${Date.now()}-${next.length}-${file.name || "image"}`,
          name: file.name || "screenshot",
          type,
          size: file.size,
          dataUrl,
        });
      } catch (_) {
        nextError = "Could not read that image.";
      }
    }
    setPendingImages(next);
    setAttachError(nextError);
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const onComposerPaste = (e) => {
    const fromFiles = [...(e.clipboardData?.files || [])].filter((file) => String(file.type || "").startsWith("image/"));
    const fromItems = [...(e.clipboardData?.items || [])]
      .filter((item) => item.kind === "file" && String(item.type || "").startsWith("image/"))
      .map((item) => item.getAsFile())
      .filter(Boolean);
    const files = fromFiles.length ? fromFiles : fromItems;
    if (!files.length) return;
    e.preventDefault();
    addPendingFiles(files);
  };

  const clearComposer = () => {
    setInput("");
    setPendingImages([]);
    setAttachError(null);
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const sendNow = async (content, images) => {
    const gen = chatGenRef.current;
    if (isMobile) setSidebarOpen(false);
    loadingRef.current = true;
    setLoading(true);
    setError(null);
    const apiContent = images.length
      ? [
          { type: "text", text: content || "What's in this screenshot?" },
          ...images.map((img) => ({ type: "image_url", image_url: { url: img.dataUrl } })),
        ]
      : content;
    const userMsg = { role: "user", content: apiContent, time: nowLabel() };
    const newHistory = [...messagesRef.current, userMsg];
    messagesRef.current = newHistory;
    setMessages(newHistory);
    try {
      // If agent asks for Excel/PDF, reuse the latest remembered comparison.
      if (wantsExcelExport(userMessageText(apiContent))) {
        const lastOffer = [...newHistory].reverse().find((m) => m.role === "offer" && m.plans?.length >= 2);
        const remembered = lastComparisonExportRef.current;
        let fromThread = lastOffer?.plans || (remembered && remembered.plans) || (Array.isArray(remembered) ? remembered : []) || [];
        if (fromThread.length < 2) {
          const assistantMsgs = newHistory.filter((m) => m.role === "assistant");
          for (let i = assistantMsgs.length - 1; i >= 0; i--) {
            const found = findComparisonPlans(assistantMsgs[i].content || "");
            if (found.length >= 2) {
              fromThread = found;
              break;
            }
          }
        }
        if (fromThread.length >= 2) {
          fromThread = fromThread.slice(0, 4);
          const payload = collectComparisonExport(newHistory, fromThread, {
            drugs: (remembered && remembered.drugs) || [],
          });
          lastComparisonExportRef.current = payload;
          scheduleAutoSave(payload);
          const labels = fromThread.map((p) => `${p.carrier} ${p.planName} (${p.planId})`).join(" vs ");
          const assistantMsg = {
            role: "assistant",
            content: `Got it — here's the side-by-side export for ${labels}. Click Excel or PDF below.`,
            time: nowLabel(),
          };
          const nextMsgs = [
            ...newHistory.filter((m) => m.role !== "offer"),
            assistantMsg,
            { role: "offer", content: "export", plans: payload.plans, clientName: payload.clientName, terminatingPlan: payload.terminatingPlan, doctors: payload.doctors, drugs: payload.drugs, time: nowLabel() },
          ];
          messagesRef.current = nextMsgs;
          setMessages(nextMsgs);
          return;
        }
      }

      const result = await askGuru(window.MaxClientWorkups.messagesForApi(
        newHistory.filter((m) => m.role === "user" || m.role === "assistant").map((m) => ({ role: m.role, content: m.content })),
        loadedWorkupRef.current
      ));
      if (gen !== chatGenRef.current) return;
      const reply = result.text;
      if (result.banners.length) {
        setBanners((current) => {
          const byId = new Map(current.map((banner) => [banner.id, banner]));
          result.banners.forEach((banner) => byId.set(banner.id, banner));
          return [...byId.values()];
        });
      }
      const assistantMsg = { role: "assistant", content: reply, time: nowLabel() };
      const found = findComparisonPlans(reply);
      let nextMsgs;
      if (found.length >= 2) {
        const payload = collectComparisonExport([...newHistory, assistantMsg], found.slice(0, 4), {
          drugs: [
            ...((lastComparisonExportRef.current && lastComparisonExportRef.current.drugs) || []),
            ...drugsFromToolResults(result.toolResults),
          ],
        });
        lastComparisonExportRef.current = payload;
        scheduleAutoSave(payload);
        nextMsgs = [...newHistory.filter(m => m.role !== 'offer'), assistantMsg, { role: "offer", content: "export", plans: payload.plans, clientName: payload.clientName, terminatingPlan: payload.terminatingPlan, doctors: payload.doctors, drugs: payload.drugs, time: nowLabel() }];
      } else {
        nextMsgs = [...newHistory.filter(m => m.role !== 'offer'), assistantMsg];
      }
      messagesRef.current = nextMsgs;
      setMessages(nextMsgs);
    } catch (err) {
      if (gen !== chatGenRef.current) return;
      if (err && err.code === "access_required") {
        setUnlocked(false);
        setGateError("Session expired — sign in with your email and password again.");
        return;
      }
      if (err && err.code === "invalid_image") {
        setAttachError(err.message || "Images must be PNG, JPEG, or WebP under 4MB.");
        return;
      }
      setError("Couldn't reach Max. Check your connection and try again — if this keeps happening, Railway may be redeploying.");
    } finally {
      if (gen !== chatGenRef.current) {
        loadingRef.current = false;
        setLoading(false);
        return;
      }
      const next = queuedRef.current;
      if (next) {
        clearQueued();
        await sendNow(next.text, next.images || []);
        return;
      }
      loadingRef.current = false;
      setLoading(false);
    }
  };

  const send = (text) => {
    const fromComposer = text == null;
    const content = (fromComposer ? input : String(text)).trim();
    const images = fromComposer ? pendingImages : [];
    if (!content && !images.length) return;
    if (loadingRef.current) {
      storeQueued({ text: content, images: [...images] });
      if (fromComposer) clearComposer();
      return;
    }
    if (fromComposer) clearComposer();
    void sendNow(content, images);
  };

  if (accessGateOn && !unlocked) {
    return (
      <div style={{ minHeight: "100%", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "var(--font)" }}>
        <form onSubmit={submitUnlock} className="max-fade" style={{
          width: "100%", maxWidth: 400, padding: "28px 24px", borderRadius: 20,
          background: "rgba(255,255,255,0.78)", border: "1px solid var(--line)", backdropFilter: "blur(16px)",
          boxShadow: "0 20px 60px rgba(42,21,64,0.12)",
        }}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><Avatar size={64} showStatus={true} /></div>
          <h1 style={{ fontFamily: "var(--display)", fontSize: 34, margin: 0, textAlign: "center", letterSpacing: "-0.03em" }}>Max</h1>
          <p style={{ margin: "10px 0 0", textAlign: "center", color: "var(--muted)", fontSize: 13.5, lineHeight: 1.45 }}>
            Invite-only for THEI leadership. Sign in with your THEI email and access password.
          </p>
          <input
            type="email"
            value={gateEmail}
            onChange={(e) => setGateEmail(e.target.value)}
            placeholder="you@healthexps.com"
            autoComplete="username"
            autoFocus
            style={{
              width: "100%", marginTop: 20, padding: "12px 14px", borderRadius: 12,
              border: "1px solid var(--line)", background: "#fff", fontFamily: "var(--font)", fontSize: 14.5,
            }}
          />
          <input
            type="password"
            value={gatePassword}
            onChange={(e) => setGatePassword(e.target.value)}
            placeholder="Access password"
            autoComplete="current-password"
            style={{
              width: "100%", marginTop: 10, padding: "12px 14px", borderRadius: 12,
              border: "1px solid var(--line)", background: "#fff", fontFamily: "var(--font)", fontSize: 14.5,
            }}
          />
          {gateError && (
            <div style={{ marginTop: 10, fontSize: 12.5, color: "#9B1C3C" }}>{gateError}</div>
          )}
          <button
            type="submit"
            disabled={gateLoading || !gateEmail.trim() || !gatePassword.trim()}
            style={{
              width: "100%", marginTop: 14, padding: "12px 14px", borderRadius: 12, border: "none",
              background: gateLoading || !gateEmail.trim() || !gatePassword.trim() ? "rgba(69,32,104,0.25)" : "linear-gradient(135deg, var(--plum), var(--magenta))",
              color: "#fff", fontWeight: 600, fontSize: 14, cursor: gateLoading || !gateEmail.trim() || !gatePassword.trim() ? "default" : "pointer",
              fontFamily: "var(--font)",
            }}
          >
            {gateLoading ? "Checking…" : "Unlock Max"}
          </button>
          <p style={{ margin: "14px 0 0", textAlign: "center", fontSize: 11.5, color: "var(--muted)" }}>
            Costs are metered per question — keep the password off Agent Hub.
          </p>
        </form>
      </div>
    );
  }

  const shell = {
    display: "flex",
    height: "100%",
    width: "100%",
    fontFamily: "var(--font)",
    color: "var(--ink)",
  };

  return (
    <div style={shell}>
      {/* Mobile backdrop */}
      {isMobile && sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(26,18,36,0.45)", zIndex: 20, backdropFilter: "blur(2px)" }} />
      )}

      {/* Sidebar */}
      <aside
        style={
          isMobile
            ? {
                position: "fixed", top: 0, bottom: 0, left: 0, width: 280, zIndex: 21,
                background: "rgba(255,255,255,0.92)", backdropFilter: "blur(16px)",
                display: "flex", flexDirection: "column", overflow: "hidden",
                boxShadow: "8px 0 40px rgba(42,21,64,0.18)",
                transform: sidebarOpen ? "translateX(0)" : "translateX(-100%)",
                transition: "transform 0.25s ease",
                borderRight: "1px solid var(--line)",
              }
            : {
                width: sidebarWidth, flexShrink: 0,
                background: "rgba(255,255,255,0.55)", backdropFilter: "blur(14px)",
                borderRight: "1px solid var(--line)",
                display: "flex", flexDirection: "column", overflow: "hidden",
                userSelect: isDragging ? "none" : "auto",
              }
        }
      >
        <div style={{ padding: collapsed ? "18px 0" : "22px 18px 16px", display: "flex", flexDirection: "column", alignItems: collapsed ? "center" : "stretch", gap: 10 }}>
          {collapsed ? (
            <Avatar size={34} />
          ) : (
            <>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <Avatar size={42} showStatus={true} />
                <div>
                  <div style={{ fontFamily: "var(--display)", fontWeight: 700, fontSize: 26, lineHeight: 1, letterSpacing: "-0.02em" }}>Max</div>
                  <div style={{ fontSize: 11.5, color: "var(--muted)", marginTop: 4, fontWeight: 500 }}>THEI · Internal only</div>
                </div>
              </div>
              <button
                onClick={startNewChat}
                style={{
                  marginTop: 6, width: "100%", padding: "11px 14px", borderRadius: 12,
                  border: "1px solid transparent",
                  background: "linear-gradient(135deg, var(--plum-deep) 0%, var(--plum) 55%, var(--magenta) 140%)",
                  color: "#fff", fontWeight: 600, fontSize: 13.5, cursor: "pointer",
                  fontFamily: "var(--font)", letterSpacing: "0.01em",
                }}
              >
                New chat
              </button>
              <button
                onClick={() => void saveWorkup(lastComparisonExportRef.current)}
                disabled={savingWorkup}
                data-testid="save-workup"
                style={{
                  width: "100%", padding: "9px 14px", borderRadius: 12,
                  border: "1px solid var(--line)", background: "rgba(255,255,255,0.85)",
                  color: "var(--plum)", fontWeight: 600, fontSize: 13, cursor: savingWorkup ? "default" : "pointer",
                  fontFamily: "var(--font)",
                }}
              >
                {savingWorkup ? "Saving…" : (currentWorkupId ? "Update workup" : "Save workup")}
              </button>
            </>
          )}
          {collapsed && (
            <button onClick={startNewChat} title="New chat" style={{ width: 40, height: 40, borderRadius: 12, border: "none", background: "var(--plum)", color: "#fff", cursor: "pointer", fontSize: 20, lineHeight: 1 }}>+</button>
          )}
        </div>

        {!collapsed && (
          <div className="max-scroll" style={{ flex: 1, overflowY: "auto", padding: "4px 14px 18px" }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: "var(--muted)", letterSpacing: "0.06em", textTransform: "uppercase", margin: "8px 4px 10px" }}>Quick asks</div>
            {QUICK_ASKS.map((q) => (
              <button
                key={q.label}
                onClick={() => send(q.prompt)}
                style={{
                  display: "block", width: "100%", textAlign: "left", marginBottom: 8,
                  padding: "11px 12px", borderRadius: 12, cursor: "pointer",
                  border: "1px solid var(--line)", background: "var(--chip)",
                  fontFamily: "var(--font)", fontSize: 12.5, fontWeight: 500, color: "var(--ink)",
                }}
              >
                {q.label}
              </button>
            ))}

            <div style={{ fontSize: 11, fontWeight: 600, color: "var(--muted)", letterSpacing: "0.06em", textTransform: "uppercase", margin: "18px 4px 6px" }}>Client workups</div>
            <div style={{ fontSize: 11, color: "var(--muted)", lineHeight: 1.4, margin: "0 4px 10px" }}>
              Synced to your Max login — same list on phone and desktop. Structured facts only (not the old chat).
            </div>
            {workupNotice && (
              <div style={{ fontSize: 11.5, color: "var(--plum)", background: "rgba(245,243,255,.9)", border: "1px solid var(--line)", borderRadius: 10, padding: "8px 10px", marginBottom: 8 }}>{workupNotice}</div>
            )}
            {workupsLoading && <div style={{ fontSize: 12, color: "var(--muted)", padding: "6px 4px" }}>Loading…</div>}
            {!workupsLoading && workups.length === 0 && (
              <div style={{ fontSize: 12, color: "var(--muted)", padding: "6px 4px" }}>No saved workups yet.</div>
            )}
            {workups.map((w) => {
              const label = window.MaxClientWorkups.workupListLabel(w);
              const active = currentWorkupId === w.id;
              return (
                <div key={w.id} data-testid="workup-row" style={{
                  marginBottom: 8, padding: "10px 10px 8px", borderRadius: 12,
                  border: active ? "1px solid var(--plum)" : "1px solid var(--line)",
                  background: active ? "rgba(69,32,104,0.06)" : "rgba(255,255,255,0.7)",
                }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink)", lineHeight: 1.3 }}>{label}</div>
                  <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 3 }}>
                    {window.MaxClientWorkups.formatUpdatedAt(w.updatedAt)}
                    {w.county ? " · " + w.county : ""}
                  </div>
                  <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                    <button
                      onClick={() => void openWorkup(w.id)}
                      style={{ flex: 1, padding: "6px 8px", borderRadius: 8, border: "none", background: "var(--plum)", color: "#fff", fontSize: 11.5, fontWeight: 600, cursor: "pointer", fontFamily: "var(--font)" }}
                    >
                      Open
                    </button>
                    <button
                      onClick={() => void deleteWorkup(w.id, label)}
                      style={{ padding: "6px 8px", borderRadius: 8, border: "1px solid var(--line)", background: "#fff", color: "var(--muted)", fontSize: 11.5, fontWeight: 600, cursor: "pointer", fontFamily: "var(--font)" }}
                    >
                      Delete
                    </button>
                  </div>
                </div>
              );
            })}

          </div>
        )}
      </aside>

      {/* Drag handle -- desktop only */}
      {!isMobile && (
        <div
          onMouseDown={() => setIsDragging(true)}
          style={{ width: 5, flexShrink: 0, cursor: "col-resize", background: isDragging ? "var(--magenta)" : "transparent", transition: isDragging ? "none" : "background 0.15s", position: "relative" }}
          onMouseEnter={(e) => { if (!isDragging) e.currentTarget.style.background = "rgba(69,32,104,0.12)"; }}
          onMouseLeave={(e) => { if (!isDragging) e.currentTarget.style.background = "transparent"; }}
        />
      )}

      {/* Main chat */}
      <main style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <header style={{
          display: "flex", alignItems: "center", gap: 12, padding: isMobile ? "12px 14px" : "14px 22px",
          background: "rgba(255,255,255,0.62)", backdropFilter: "blur(14px)",
          borderBottom: "1px solid var(--line)",
        }}>
          <button
            onClick={() => { if (isMobile) { setSidebarOpen((v) => !v); } else { setSidebarWidth((w) => (w < 140 ? 248 : MIN_SIDEBAR)); } }}
            aria-label="Toggle menu"
            style={{ width: 36, height: 36, borderRadius: 10, border: "1px solid var(--line)", background: "rgba(255,255,255,0.7)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: "var(--plum)" }}
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
            </svg>
          </button>
          <Avatar size={38} showStatus={true} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: "var(--display)", fontWeight: 700, fontSize: 20, letterSpacing: "-0.02em", lineHeight: 1.1 }}>Max</div>
            <div style={{ fontSize: 12, color: "#2F9E57", display: "flex", alignItems: "center", gap: 6, marginTop: 2, fontWeight: 500 }}>
              <span className="max-online-dot" style={{ width: 7, height: 7, borderRadius: "50%", background: "#3FAE5C", display: "inline-block" }} />
              Online · {PLANS.length} plans
            </div>
          </div>
          {!isMobile && (
            <button onClick={startNewChat} style={{ padding: "8px 12px", borderRadius: 10, border: "1px solid var(--line)", background: "rgba(255,255,255,0.8)", cursor: "pointer", fontFamily: "var(--font)", fontSize: 12.5, fontWeight: 600, color: "var(--plum)" }}>
              New chat
            </button>
          )}
          <button
            onClick={() => void saveWorkup(lastComparisonExportRef.current)}
            disabled={savingWorkup}
            title="Save structured workup to your Max login"
            style={{ padding: "8px 12px", borderRadius: 10, border: "1px solid var(--line)", background: "rgba(255,255,255,0.8)", cursor: savingWorkup ? "default" : "pointer", fontFamily: "var(--font)", fontSize: 12.5, fontWeight: 600, color: "var(--plum)" }}
          >
            {currentWorkupId ? "Update" : "Save"}
          </button>
          <button onClick={lockMax} title="Lock Max" style={{ padding: "8px 12px", borderRadius: 10, border: "1px solid var(--line)", background: "rgba(255,255,255,0.8)", cursor: "pointer", fontFamily: "var(--font)", fontSize: 12.5, fontWeight: 600, color: "var(--muted)" }}>
            Lock
          </button>
        </header>

        <div style={{
          flex: "none", textAlign: "center", padding: "8px 16px",
          fontSize: 11.5, fontWeight: 500, color: "var(--plum)",
          background: "rgba(255,16,144,0.06)", borderBottom: "1px solid rgba(255,16,144,0.12)",
        }}>
          Internal agents only · cites the THEI grid · never ranks plans
        </div>

        {/* Messages */}
        <div className="max-scroll" style={{ flex: 1, overflowY: "auto", padding: isMobile ? "16px 14px" : "24px 22px", display: "flex", flexDirection: "column", gap: 4 }}>
          {banners.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
              {banners.map((banner) => (
                <div key={banner.id} className="max-fade" style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12,
                  padding: "10px 12px", borderRadius: 12,
                  border: banner.type === "warning" ? "1px solid rgba(180,83,9,.28)" : "1px solid rgba(109,40,217,.20)",
                  background: banner.type === "warning" ? "rgba(255,247,237,.94)" : "rgba(245,243,255,.94)",
                  color: banner.type === "warning" ? "#92400e" : "var(--plum)",
                  fontSize: 12.5, lineHeight: 1.4,
                }}>
                  <span>{banner.message}</span>
                  <button onClick={() => setBanners((current) => current.filter((item) => item.id !== banner.id))}
                    aria-label="Dismiss notice"
                    style={{ border: "none", background: "transparent", color: "inherit", cursor: "pointer", fontSize: 16, lineHeight: 1 }}>×</button>
                </div>
              ))}
            </div>
          )}
          {messages.length === 0 && (
            <div className="max-fade" style={{ maxWidth: 560, margin: "8vh auto 0", textAlign: "center" }}>
              <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
                <Avatar size={72} showStatus={true} />
              </div>
              <h1 style={{ fontFamily: "var(--display)", fontWeight: 700, fontSize: isMobile ? 36 : 44, margin: 0, letterSpacing: "-0.03em", lineHeight: 1.05 }}>
                Max
              </h1>
              <p style={{ margin: "12px auto 0", maxWidth: 420, fontSize: 14.5, lineHeight: 1.5, color: "var(--muted)", fontWeight: 400 }}>
                Your THEI Medicare desk partner — plan benefits, givebacks, duals, and grid facts, cited.
              </p>
              <div style={{ marginTop: 28, display: "flex", flexDirection: "column", gap: 8, alignItems: "stretch" }}>
                {SUGGESTIONS.map((s, idx) => (
                  <button
                    key={s.label}
                    onClick={() => send(s.prompt)}
                    className="max-fade"
                    style={{
                      animationDelay: `${0.08 * (idx + 1)}s`,
                      textAlign: "left", padding: "13px 16px", borderRadius: 14,
                      border: "1px solid var(--line)", background: "rgba(255,255,255,0.7)",
                      cursor: "pointer", fontFamily: "var(--font)", fontSize: 13.5, fontWeight: 500,
                      color: "var(--ink)", backdropFilter: "blur(8px)",
                    }}
                  >
                    <span style={{ color: "var(--magenta)", marginRight: 8, fontWeight: 600 }}>Ask</span>
                    {s.label}
                  </button>
                ))}
              </div>
            </div>
          )}
          {messages.map((m, i) => m.role === "workup" ? (
            <div key={i} className="max-fade" data-testid="loaded-workup-card" style={{ display: "flex", justifyContent: "flex-start", gap: 8, marginBottom: 10 }}>
              <Avatar size={30} />
              <div style={{ maxWidth: "78%", display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
                <div style={{ padding: "12px 14px", borderRadius: 16, borderTopLeftRadius: 4, background: "rgba(245,243,255,0.95)", color: "var(--ink)", fontSize: 14, lineHeight: 1.45, border: "1px solid var(--line)" }}>
                  <div style={{ fontWeight: 700, marginBottom: 6 }}>Loaded workup{m.workup && m.workup.clientName ? " — " + m.workup.clientName : ""}</div>
                  <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 8 }}>Continuing from structured facts only — not the old chat. Export still works below.</div>
                  {m.workup && m.workup.plans && m.workup.plans.length > 0 && (
                    <div style={{ fontSize: 13 }}>
                      {(m.workup.plans || []).map((p) => (
                        <div key={p.planId}>{(p.carrier ? p.carrier + " " : "") + (p.planName || "")} ({p.planId})</div>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 4 }}>{m.time}</div>
              </div>
            </div>
          ) : m.role === 'offer' ? (
            <div key={i} className="max-fade" style={{ display: "flex", justifyContent: "flex-start", gap: 8, marginBottom: 10 }}>
              <Avatar size={30} />
              <div style={{ maxWidth: "72%", display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
                <div style={{ padding: "12px 14px", borderRadius: 16, borderTopLeftRadius: 4, background: "rgba(255,255,255,0.88)", color: "var(--ink)", fontSize: 14.5, lineHeight: 1.5, border: "1px solid var(--line)" }}>
                  <div style={{ marginBottom: 10 }}>Want this comparison as Excel or PDF?</div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <button onClick={() => { exportComparisonToExcel(m); setMessages(prev => prev.filter((_,j) => j !== i)); }}
                      style={{ padding: "8px 14px", borderRadius: 10, border: "none", background: "linear-gradient(135deg, var(--plum) 0%, var(--magenta) 120%)", color: "white", fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "var(--font)" }}>
                      Export Excel
                    </button>
                    <button onClick={() => { exportComparisonToPdf(m); setMessages(prev => prev.filter((_,j) => j !== i)); }}
                      style={{ padding: "8px 14px", borderRadius: 10, border: "1px solid var(--line)", background: "rgba(255,255,255,0.8)", color: "var(--plum)", fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "var(--font)" }}>
                      Export PDF
                    </button>
                    <button onClick={() => setMessages(prev => prev.filter((_,j) => j !== i))}
                      style={{ padding: "8px 14px", borderRadius: 10, border: "1px solid var(--line)", background: "rgba(255,255,255,0.8)", color: "var(--plum)", fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "var(--font)" }}>
                      Dismiss
                    </button>
                  </div>
                </div>
                <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 4 }}>{m.time}</div>
              </div>
            </div>
          ) : (
            <div key={i} className="max-fade" style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start", gap: 8, marginBottom: 10 }}>
              {m.role === "assistant" && <Avatar size={30} />}
              <div style={{ maxWidth: "72%", display: "flex", flexDirection: "column", alignItems: m.role === "user" ? "flex-end" : "flex-start" }}>
                <div style={{
                  padding: "11px 14px", borderRadius: 16,
                  borderTopLeftRadius: m.role === "assistant" ? 4 : 16,
                  borderTopRightRadius: m.role === "user" ? 4 : 16,
                  background: m.role === "user" ? "linear-gradient(135deg, var(--plum-deep), var(--plum))" : "rgba(255,255,255,0.88)",
                  color: m.role === "user" ? "#FFFFFF" : "var(--ink)",
                  fontSize: 14.5, lineHeight: 1.55, whiteSpace: "pre-wrap",
                  border: m.role === "assistant" ? "1px solid var(--line)" : "none",
                }}>
                  {m.role === "assistant" ? renderMessageText(m.content) : (
                    <>
                      {userMessageImages(m.content).length > 0 && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: userMessageText(m.content) ? 8 : 0 }}>
                          {userMessageImages(m.content).map((src, idx) => (
                            <img key={idx} src={src} alt="Attached screenshot" style={{ maxWidth: 168, maxHeight: 120, borderRadius: 8, objectFit: "cover", border: "1px solid rgba(255,255,255,0.25)" }} />
                          ))}
                        </div>
                      )}
                      {userMessageText(m.content)}
                    </>
                  )}
                </div>
                <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 4 }}>{m.time}</div>
              </div>
            </div>
          ))}
          {loading && (
            <div style={{ display: "flex", gap: 8 }}>
              <Avatar size={30} />
              <div style={{ background: "rgba(255,255,255,0.88)", borderRadius: 16, borderTopLeftRadius: 4, border: "1px solid var(--line)" }}>
                <TypingIndicator />
              </div>
            </div>
          )}
          {error && (
            <div style={{ fontSize: 12.5, color: "#9B1C3C", background: "rgba(255,230,236,0.9)", border: "1px solid rgba(155,28,60,0.2)", borderRadius: 12, padding: "10px 12px", marginTop: 8 }}>{error}</div>
          )}
          <div ref={bottomRef} />
        </div>

        {/* Input */}
        <div style={{ padding: isMobile ? "12px 14px max(12px, env(safe-area-inset-bottom))" : "16px 22px", background: "rgba(255,255,255,0.7)", backdropFilter: "blur(14px)", borderTop: "1px solid var(--line)" }} onPaste={onComposerPaste}>
          <div style={{ maxWidth: 900, margin: "0 auto" }}>
            {pendingImages.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
                {pendingImages.map((img) => (
                  <div key={img.id} style={{ position: "relative", width: 56, height: 56 }}>
                    <img src={img.dataUrl} alt={img.name || "Attached"} style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 10, border: "1px solid var(--line)" }} />
                    <button
                      type="button"
                      onClick={() => setPendingImages((current) => current.filter((item) => item.id !== img.id))}
                      aria-label="Remove image"
                      style={{
                        position: "absolute", top: -6, right: -6, width: 18, height: 18, borderRadius: "50%",
                        border: "none", background: "var(--plum)", color: "#fff", fontSize: 12, lineHeight: "18px",
                        cursor: "pointer", padding: 0,
                      }}
                    >×</button>
                  </div>
                ))}
              </div>
            )}
            {attachError && (
              <div style={{ fontSize: 12.5, color: "#9B1C3C", marginBottom: 8 }}>{attachError}</div>
            )}
            {queued && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <span
                  data-testid="queued-chip"
                  style={{
                    display: "inline-flex", alignItems: "center", gap: 8, maxWidth: "100%",
                    padding: "5px 10px", borderRadius: 999,
                    background: "rgba(69,32,104,0.08)", border: "1px solid var(--line)",
                    color: "var(--plum)", fontWeight: 600, fontSize: 12.5,
                  }}
                >
                  Queued
                  <span style={{ fontWeight: 500, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 280 }}>
                    {queued.text || (queued.images?.length ? `${queued.images.length} image${queued.images.length > 1 ? "s" : ""}` : "next message")}
                  </span>
                </span>
                <button
                  type="button"
                  onClick={clearQueued}
                  aria-label="Cancel queued message"
                  style={{
                    width: 22, height: 22, borderRadius: "50%", border: "1px solid var(--line)",
                    background: "#fff", color: "var(--plum)", cursor: "pointer", fontSize: 13, lineHeight: "20px", padding: 0,
                  }}
                >×</button>
              </div>
            )}
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <input
                ref={fileInputRef}
                type="file"
                accept="image/png,image/jpeg,image/webp"
                multiple
                hidden
                onChange={(e) => addPendingFiles(e.target.files)}
              />
              <button
                type="button"
                onClick={() => fileInputRef.current?.click()}
                aria-label="Attach screenshot"
                title="Attach PNG, JPEG, or WebP"
                style={{
                  width: 46, height: 46, borderRadius: 14, border: "1px solid var(--line)",
                  background: "rgba(255,255,255,0.9)", color: "var(--plum)", cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                }}
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M21.4 11.6l-8.8 8.8a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6l8.1-8.1" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
              <input
                ref={inputRef}
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && send()}
                onPaste={onComposerPaste}
                placeholder={loading ? "Type the next question — it will queue…" : "Ask Max, or paste a screenshot…"}
                style={{
                  flex: 1, padding: "13px 18px", borderRadius: 14,
                  border: "1px solid var(--line)", background: "rgba(255,255,255,0.9)",
                  fontSize: 14.5, outline: "none", fontFamily: "var(--font)", color: "var(--ink)",
                }}
              />
              <button
                onClick={() => send()}
                disabled={!input.trim() && !pendingImages.length}
                aria-label="Send"
                style={{
                  width: 46, height: 46, borderRadius: 14, border: "none",
                  background: (!input.trim() && !pendingImages.length) ? "rgba(69,32,104,0.25)" : "linear-gradient(135deg, var(--plum) 0%, var(--magenta) 120%)",
                  color: "white", fontSize: 18, cursor: (!input.trim() && !pendingImages.length) ? "default" : "pointer", flexShrink: 0,
                }}
              >
                &#8593;
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
