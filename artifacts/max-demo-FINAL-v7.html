<script>
/**
 * Max client plan comparison export (Yahoska / Arias Lazo layout).
 * Works in the browser (window.MaxComparisonExport) and in Node tests.
 * Benefit dollars always come from plan objects — never from chat prose.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  if (root && typeof root === "object") root.MaxComparisonExport = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const PURPLE = "5B2C8B";
  const PURPLE_FONT = "FFFFFF";
  const GREEN = "1B7A3A";
  const RED = "9B1C3C";
  const YELLOW = "FFF2A8";
  const TITLE_COLOR = "2A1540";
  const LINK_BLUE = "0563C1";
  const SECTION_FILL = "F3EEF7";

  // Sample labels and order. Keys map to THEI #plan-data fields.
  const FIELD_ROWS = [
    ["Premium", "premium"],
    ["Part B Rebate", "partBGiveback"],
    ["Referrals Needed?", "referral"],
    ["MSP Levels", "mspLevels"],
    ["Max Out of Pocket", "moop"],
    ["Inpatient Hospital", "inpatientHospital"],
    ["Outpatient Hospital", "outpatientHospital"],
    ["PCP", "pcpCopay"],
    ["Specialist", "specialistCopay"],
    ["ER", "erCopay"],
    ["Urgent Care", "urgentCareCopay"],
    ["Advanced Imaging (MRI, CT, PET)", "advancedImaging"],
    ["Hearing Services", "hearing"],
    ["Dental", "dental"],
    ["Deep Cleaning", "dentalDeepCleaning"],
    ["Dentures", "dentalDentures"],
    ["Fillings", "dentalFillings"],
    ["Root Canals", "dentalRootCanals"],
    ["Extractions", "dentalExtractions"],
    ["Crowns", "dentalCrowns"],
    ["Bridges", "dentalBridges"],
    ["Implants", "dentalImplants"],
    ["Vision Allowance", "vision"],
    ["Ambulance", "ambulance"],
    ["Transportation", "transportation"],
    ["Companionship", "companionship"],
    ["Custodial Care", "custodialCare"],
    ["RX Deductible", "rxDeductible"],
    ["Tier 1", "tier1"],
    ["Tier 2", "tier2"],
    ["Tier 3", "tier3"],
    ["Tier 4", "tier4"],
    ["Tier 5", "tier5"],
    ["Tier 6", "tier6"],
    ["OTC", "otc"],
    ["Grocery Card", "groceryCardDetail"],
    ["Acupuncture", "acupuncture"],
    ["Fitness", "fitness"],
  ];

  const HIGHLIGHT_KEYS = { hearing: true, otc: true };
  const NETWORK_IN = "In network";
  const NETWORK_OUT = "Out of network";
  const NETWORK_NOT_CONFIRMED = "Not confirmed";
  const NETWORK_NEED_MORE = "Need more info";

  const CLIENT_NAME_BLOCK = /^(miami|dade|broward|florida|medicare|humana|united|uhc|careplus|devoted|wellcare|aetna|simply|solis|healthsun|healthspring|doctors?|client|export|excel|compare|comparison|plan|dual|complete|preferred|summary|benefits|thei|max|pdf|sheet)$/i;

  function escapeRe(s) {
    return String(s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function safeExportPlanId(id) {
    return String(id || "")
      .replace(/\s+/g, "")
      .replace(/[\\/?%*:|"<>]/g, "-");
  }

  function displayContractPbp(plan) {
    let id = String((plan && (plan.planId || plan.id)) || "").replace(/\s+/g, "");
    id = id.replace(/-000$/i, "").replace(/\/000$/i, "");
    return id;
  }

  function formatPlanMarketingName(plan) {
    if (!plan) return "";
    const rawId = String(plan.planId || plan.id || "").replace(/\s+/g, "");
    const dispId = displayContractPbp(plan);
    const stripIds = (s) => {
      let out = String(s || "");
      if (rawId) out = out.replace(new RegExp(escapeRe(rawId), "ig"), " ");
      if (dispId && dispId !== rawId) out = out.replace(new RegExp(escapeRe(dispId), "ig"), " ");
      return out.replace(/\s+/g, " ").trim();
    };
    let name = stripIds(plan.planName);
    let carrier = stripIds(plan.carrier);
    if (!name) name = carrier;
    else if (carrier) {
      const n = name.toLowerCase();
      const c = carrier.toLowerCase();
      if (c === n) {
        /* already the same */
      } else if (n.startsWith(c) || c.includes(n)) {
        if (c.length > n.length && c.includes(n)) name = carrier;
      } else if (!c.startsWith(n) && !n.includes(c)) {
        name = (carrier + " " + name).replace(/\s+/g, " ").trim();
      }
    }
    return String(name || "").replace(/\s+/g, " ").trim();
  }

  function formatPlanColumnHeader(plan) {
    const name = formatPlanMarketingName(plan);
    const id = displayContractPbp(plan);
    return id ? name + "\n" + id : name;
  }

  function isBlankish(v) {
    if (v === undefined || v === null) return true;
    const s = String(v).trim();
    return s === "" || /^["'\s*]+$/.test(s);
  }

  function normalizeGapToken(s) {
    const t = String(s).trim();
    if (/^not\s*listed$/i.test(t)) return "Not listed";
    if (/^n\/a$/i.test(t)) return "N/A";
    if (/^sob\s*pending$/i.test(t)) return "SOB pending";
    if (/^eoc\s*pending$/i.test(t)) return "EOC pending";
    return t;
  }

  function formatBenefitValue(v, key) {
    if (isBlankish(v)) return "Not listed";
    if (key === "partBGiveback" && typeof v === "number") {
      return v === 0 ? "$0" : "$" + v;
    }
    if (typeof v === "number") {
      if (v > 0 && v < 1) return Math.round(v * 1000) / 10 + "%";
      return "$" + v;
    }
    if (Array.isArray(v)) return v.length ? v.join("; ") : "Not listed";
    return normalizeGapToken(v);
  }

  function formatSobCell(plan) {
    const url = plan && plan.sobUrl ? String(plan.sobUrl).trim() : "";
    if (url) return { text: "Summary of Benefits", url };
    return { text: "SOB pending" };
  }

  function formatEocCell(plan) {
    const url = plan && plan.eocUrl ? String(plan.eocUrl).trim() : "";
    if (url) return { text: "Evidence of Coverage", url };
    return { text: "EOC pending" };
  }

  function looksLikePersonName(name) {
    const parts = String(name || "").trim().split(/\s+/);
    if (parts.length < 2 || parts.length > 4) return false;
    if (/\d/.test(name)) return false;
    return parts.every((p) => {
      if (CLIENT_NAME_BLOCK.test(p)) return false;
      return /^(?:[A-Z][A-Za-z.'-]+|de|del|la|le|da|van|von)$/i.test(p);
    });
  }

  function extractClientName(text) {
    if (!text) return "";
    // Do not use the /i flag: it makes [A-Z] match lowercase and grabs "for both plans".
    const name = "([A-Z][a-zA-Z'-]+(?:\\s+[A-Z][a-zA-Z'-]+){1,3})";
    const patterns = [
      new RegExp("\\b[Cc]lient(?:\\s+[Nn]ame)?\\s*[:=]\\s*" + name, "g"),
      new RegExp("\\b[Cc]lient(?:\\s+[Nn]ame)?\\s+is\\s+" + name, "g"),
      new RegExp("\\bfor\\s+" + name + "(?:\\s+in\\b|\\s*[,.]|\\s*$)", "g"),
    ];
    let found = "";
    for (const re of patterns) {
      let m;
      while ((m = re.exec(text))) {
        const candidate = m[1].replace(/\s+/g, " ").trim();
        if (looksLikePersonName(candidate)) found = candidate;
      }
    }
    // Labeled household / last name (e.g. Client: Muskat) — only when explicitly labeled.
    const labeled = /\b(?:client(?:\s+name)?|household)\s*[:=]\s*([A-Za-z][A-Za-z'.-]{1,40}(?:\s+[A-Za-z][A-Za-z'.-]{1,40}){0,3})/gi;
    let m;
    while ((m = labeled.exec(text))) {
      const candidate = m[1].replace(/\s+/g, " ").trim();
      if (looksLikePersonName(candidate) || /^[A-Za-z][A-Za-z'.-]{1,40}$/.test(candidate)) {
        found = candidate;
      }
    }
    return found;
  }

  function extractTerminatingPlan(text) {
    if (!text) return "";
    const patterns = [
      /(?:plan\s+)?terminat(?:ing|es|ed|ion)\s*(?:plan)?\s*[:\-–]\s*([^\n]{3,90})/i,
      /plan\s+terminating\s+([A-Z][^\n]{2,90})/i,
      /terminating\s+plan\s+(?:is\s+)?([A-Z][^\n]{2,90})/i,
    ];
    for (const re of patterns) {
      const m = text.match(re);
      if (!m) continue;
      let value = String(m[1] || "").replace(/\s+/g, " ").trim();
      value = value.replace(/\s*[.]$/, "");
      value = value.replace(/\s+(and|for|in|on|with|who|which)\s+$/i, "").trim();
      if (value.length >= 3 && /[A-Za-z]/.test(value)) return value;
    }
    return "";
  }

  function normalizeNetworkStatus(raw) {
    if (raw === true) return NETWORK_IN;
    if (raw === false) return NETWORK_OUT;
    const s = String(raw || "").trim();
    if (!s) return "";
    if (/need\s*more\s*info/i.test(s)) return NETWORK_NEED_MORE;
    if (/not\s*confirmed/i.test(s)) return NETWORK_NOT_CONFIRMED;
    if (/^(in[-\s]?network|inn|in|true|yes|✅)$/i.test(s) || /^IN$/i.test(s) || /\bin[-\s]?network\b/i.test(s)) {
      return NETWORK_IN;
    }
    if (
      /^(out(?:\s+of)?[-\s]?network|oon|out|false|no|❌)$/i.test(s) ||
      /^OUT$/i.test(s) ||
      /\bout(?:\s+of)?[-\s]?network\b/i.test(s)
    ) {
      return NETWORK_OUT;
    }
    return "";
  }

  function findDoctorNames(text) {
    const names = [];
    const seen = new Set();
    const add = (raw) => {
      let name = String(raw || "").replace(/\s+/g, " ").trim();
      name = name.replace(/[.,;:]+$/, "");
      if (!name || /^(Max|Select|Plus|Flex|Extra|Complete)$/i.test(name)) return;
      const parts = name.split(/\s+/);
      if (parts.length < 2) return;
      const key = name.toLowerCase();
      if (seen.has(key)) return;
      seen.add(key);
      names.push(/^dr\.?\s/i.test(name) ? name.replace(/^dr\.?\s+/i, "Dr. ") : "Dr. " + name);
    };
    const drRe = /\b(?:Dr\.?|Doctor)\s+([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+){1,3})/g;
    const mdRe = /\b([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+){1,2}),?\s+M\.?D\.?\b/g;
    let m;
    while ((m = drRe.exec(text))) add(m[1]);
    while ((m = mdRe.exec(text))) add(m[1]);
    return names;
  }

  function planMentionedIn(window, plan) {
    const id = String(plan.planId || plan.id || "").replace(/\s+/g, "");
    const disp = displayContractPbp(plan);
    const hay = String(window || "").toUpperCase().replace(/\s+/g, "");
    if (id && hay.includes(id.toUpperCase().replace(/\s+/g, ""))) return true;
    if (disp && disp !== id && hay.includes(disp.toUpperCase().replace(/\s+/g, ""))) return true;
    return false;
  }

  function statusTokens(window) {
    const tokens = [];
    const re = /out(?:\s+of)?[-\s]?network|in[-\s]?network|\bOON\b|\bINN\b|✅|❌/gi;
    let t;
    while ((t = re.exec(window))) {
      tokens.push(/out|oon|❌/i.test(t[0]) ? NETWORK_OUT : NETWORK_IN);
    }
    return tokens;
  }

  function applyStatusesFromWindow(window, plans, statuses) {
    const tokens = statusTokens(window);
    if (!tokens.length) return;
    const hits = plans.map((p) => planMentionedIn(window, p));
    const anyPlan = hits.some(Boolean);
    const both = /\bboth\b|\ball\s+(?:plans|of\s+them)\b/i.test(window);

    if (tokens.length === plans.length && !anyPlan) {
      tokens.forEach((s, i) => {
        statuses[i] = s;
      });
      return;
    }
    if (tokens.length === 1 && (both || hits.filter(Boolean).length === plans.length)) {
      statuses.forEach((_, i) => {
        statuses[i] = tokens[0];
      });
      return;
    }
    if (anyPlan) {
      plans.forEach((p, i) => {
        if (!hits[i]) return;
        const id = displayContractPbp(p);
        const upper = window.toUpperCase();
        const idx = upper.indexOf(id.toUpperCase());
        const local = idx >= 0 ? window.slice(Math.max(0, idx - 48), idx + id.length + 48) : window;
        const localTokens = statusTokens(local);
        if (localTokens.length) statuses[i] = localTokens[0];
        else if (tokens.length === 1) statuses[i] = tokens[0];
      });
    }
  }

  function extractDoctors(text, plans) {
    if (!text || !plans || !plans.length) return [];
    const names = findDoctorNames(text);
    const doctors = [];
    for (const name of names) {
      const statuses = plans.map(() => "");
      const bare = name.replace(/^Dr\.?\s+/i, "");
      const re = new RegExp("(?:Dr\\.?\\s+)?" + escapeRe(bare), "ig");
      let m;
      while ((m = re.exec(text))) {
        applyStatusesFromWindow(text.slice(m.index, m.index + 420), plans, statuses);
      }
      if (statuses.some(Boolean)) {
        doctors.push({
          name,
          statuses: statuses.map((s) => s || "Not listed"),
        });
      }
    }
    return doctors;
  }

  const DRUG_NAME_BLOCK = /^(the|and|for|with|from|plan|gold|plus|giveback|premium|deductible|hospital|client|miami|dade|broward|humana|tier|medicare|complete|dual|select|choice|preferred|summary|benefits|thei|max|otc|grocery|vision|dental|doctor|network)$/i;

  function looksLikeDrugName(name) {
    const s = String(name || "").replace(/\s+/g, " ").trim();
    if (s.length < 3 || s.length > 48) return false;
    if (/\d{5,}/.test(s)) return false;
    const parts = s.split(/\s+/);
    if (parts.length > 4) return false;
    if (parts.some((p) => DRUG_NAME_BLOCK.test(p))) return false;
    return /[A-Za-z]{3,}/.test(s);
  }

  function normalizeDrugName(raw) {
    return String(raw || "")
      .replace(/\s+/g, " ")
      .replace(/[.,;:]+$/, "")
      .trim();
  }

  function parseFormularyLookupLine(line) {
    if (!/FORMULARY_LOOKUP/i.test(line || "")) return null;
    const get = (key) => {
      const m = String(line).match(new RegExp("(?:^|\\s)" + key + "=([^\\s]+)", "i"));
      return m ? m[1] : "";
    };
    const drug = normalizeDrugName((get("drug") || "").replace(/_/g, " "));
    const planId = get("plan");
    if (!drug || !planId) return null;
    const verifiedNo = /verified=no/i.test(line);
    const tier = parseInt(get("verified_tier"), 10);
    const coverage = get("coverage");
    return {
      name: drug,
      planId,
      verified: !verifiedNo && ((tier >= 1 && tier <= 6) || coverage === "not_covered"),
      tier: tier >= 1 && tier <= 6 ? tier : null,
      coverage: coverage || (tier ? "covered" : null),
      costShare: (get("cost_share") || "").replace(/_/g, " ") || null,
      pa: get("pa") === "yes" ? true : get("pa") === "no" ? false : null,
      st: get("st") === "yes" ? true : get("st") === "no" ? false : null,
      source: get("source") || null,
      year: parseInt(get("year"), 10) || null,
    };
  }

  function extractClaimedMeds(text) {
    const meds = [];
    const seen = new Set();
    const re =
      /\b([A-Za-z][A-Za-z0-9'\/.+-]{2,}(?:\s+(?:\d+(?:\.\d+)?\s*(?:mg|mcg)|[A-Za-z][A-Za-z0-9'\/.+-]{2,})){0,3})\s+[\(:]?\s*(?:T(?:ier)?\s*)([1-6])\b/gi;
    let m;
    while ((m = re.exec(text || ""))) {
      const name = normalizeDrugName(m[1]);
      if (!looksLikeDrugName(name)) continue;
      const key = name.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      meds.push({ name });
    }
    return meds;
  }

  function extractVerifiedLookups(text) {
    const rows = [];
    String(text || "")
      .split(/\n/)
      .forEach((line) => {
        const parsed = parseFormularyLookupLine(line);
        if (parsed) rows.push(parsed);
      });
    return rows;
  }

  function emptyPlanDrugStatuses(plans) {
    const byPlanId = {};
    (plans || []).forEach((p) => {
      const id = displayContractPbp(p) || String(p.planId || p.id || "");
      byPlanId[id] = { verified: false, tier: null, costShare: null };
    });
    return byPlanId;
  }

  function mergeDrugPlanStatus(target, planId, incoming, plans) {
    if (!incoming) return;
    const match = (plans || []).find((p) => {
      const id = String(p.planId || p.id || "");
      const disp = displayContractPbp(p);
      return (
        String(planId || "").replace(/\s+/g, "").toUpperCase() === id.replace(/\s+/g, "").toUpperCase() ||
        String(planId || "").replace(/\s+/g, "").toUpperCase() === String(disp || "").replace(/\s+/g, "").toUpperCase() ||
        String(planId || "").toUpperCase().indexOf(String(disp || "").toUpperCase()) >= 0
      );
    });
    const key = match ? displayContractPbp(match) || String(match.planId || match.id || "") : planId;
    if (!key) return;
    const prev = target[key] || { verified: false, tier: null };
    if (incoming.verified && !prev.verified) {
      target[key] = {
        verified: true,
        tier: incoming.tier || null,
        coverage: incoming.coverage || null,
        costShare: incoming.costShare || null,
        pa: incoming.pa,
        st: incoming.st,
        source: incoming.source || null,
      };
    } else if (!target[key]) {
      target[key] = { verified: false, tier: null, costShare: incoming.costShare || null };
    }
  }

  function extractDrugs(text, plans) {
    const byName = new Map();
    const add = (name) => {
      const n = normalizeDrugName(name);
      if (!looksLikeDrugName(n)) return null;
      const key = n.toLowerCase();
      if (!byName.has(key)) {
        byName.set(key, { name: n, byPlanId: emptyPlanDrugStatuses(plans) });
      }
      return byName.get(key);
    };
    extractClaimedMeds(text).forEach((med) => {
      add(med.name);
    });
    extractVerifiedLookups(text).forEach((hit) => {
      const row = add(hit.name);
      if (!row) return;
      mergeDrugPlanStatus(row.byPlanId, hit.planId, hit, plans);
    });
    return [...byName.values()];
  }

  function normalizeDrugs(drugs, plans) {
    if (!Array.isArray(drugs) || !drugs.length || !plans || !plans.length) return [];
    const byName = new Map();
    const add = (name) => {
      const n = normalizeDrugName(name);
      if (!n) return null;
      const key = n.toLowerCase();
      if (!byName.has(key)) {
        byName.set(key, { name: n, byPlanId: emptyPlanDrugStatuses(plans) });
      }
      return byName.get(key);
    };
    drugs.forEach((d) => {
      if (!d || typeof d === "string") {
        if (typeof d === "string") add(d);
        return;
      }
      const row = add(d.name || d.drug || d.drugName);
      if (!row) return;
      const map = d.byPlanId || d.statusByPlanId || {};
      Object.keys(map).forEach((planId) => {
        const incoming = map[planId] || {};
        mergeDrugPlanStatus(row.byPlanId, planId, incoming, plans);
      });
      if (Array.isArray(d.lookups)) {
        d.lookups.forEach((hit) => mergeDrugPlanStatus(row.byPlanId, hit.planId, hit, plans));
      }
    });
    return [...byName.values()];
  }

  function formatDrugCell(status, plan) {
    if (!status || !status.verified) return "Unverified";
    if (status.coverage === "not_covered") return "Not covered";
    if (!status.tier) return "Unverified";
    const cost =
      status.costShare ||
      formatBenefitValue(plan && plan["tier" + status.tier], "tier" + status.tier);
    const flags = [status.pa ? "PA" : "", status.st ? "ST" : ""].filter(Boolean).join("/");
    const costBit = cost && cost !== "Not listed" ? " · " + cost : "";
    return "Tier " + status.tier + costBit + (flags ? " · " + flags : "");
  }

  function normalizeDoctors(doctors, plans) {
    if (!Array.isArray(doctors) || !doctors.length || !plans || !plans.length) return [];
    const out = [];
    for (const d of doctors) {
      if (!d || typeof d === "string") continue;
      const name = String(d.name || d.doctor || "").trim();
      if (!name) continue;
      let statuses = [];
      if (Array.isArray(d.statuses)) {
        statuses = d.statuses.map((s) => normalizeNetworkStatus(s) || (s ? String(s) : "Not listed"));
      } else if (d.byPlanId || d.statusByPlanId) {
        const map = d.byPlanId || d.statusByPlanId;
        statuses = plans.map((p) => {
          const id = String(p.planId || p.id || "");
          const disp = displayContractPbp(p);
          return normalizeNetworkStatus(map[id] || map[disp] || map[p.id]) || "Not listed";
        });
      }
      if (!statuses.some((s) => s && s !== "Not listed")) continue;
      out.push({
        name,
        statuses: plans.map((_, i) => statuses[i] || "Not listed"),
      });
    }
    return out;
  }

  function normalizeExportPayload(plansOrPayload, meta) {
    const extra = meta && typeof meta === "object" ? meta : {};
    if (Array.isArray(plansOrPayload)) {
      return { plans: plansOrPayload, ...extra };
    }
    if (plansOrPayload && typeof plansOrPayload === "object") {
      const plans = Array.isArray(plansOrPayload.plans) ? plansOrPayload.plans : [];
      return { ...plansOrPayload, plans, ...extra };
    }
    return { plans: [], ...extra };
  }

  function buildExportPayload(plans, threadText, extras) {
    const extra = extras && typeof extras === "object" ? extras : {};
    const text = String(threadText || "");
    const clientName = extra.clientName || extractClientName(text);
    const terminatingPlan = extra.terminatingPlan || extractTerminatingPlan(text);
    const doctors = normalizeDoctors(extra.doctors, plans).length
      ? normalizeDoctors(extra.doctors, plans)
      : extractDoctors(text, plans);
    const fromExtras = normalizeDrugs(extra.drugs, plans);
    const fromThread = extractDrugs(text, plans);
    const drugs = fromExtras.length ? fromExtras : fromThread;
    if (fromExtras.length && fromThread.length) {
      fromThread.forEach((t) => {
        const hit = drugs.find((d) => d.name.toLowerCase() === t.name.toLowerCase());
        if (!hit) drugs.push(t);
        else {
          Object.keys(t.byPlanId || {}).forEach((id) => {
            mergeDrugPlanStatus(hit.byPlanId, id, t.byPlanId[id], plans);
          });
        }
      });
    }
    return {
      plans: plans || [],
      clientName: clientName || "",
      terminatingPlan: terminatingPlan || "",
      doctors,
      drugs,
    };
  }

  function comparisonExportFilename(payload, ext) {
    const plans = (payload && payload.plans) || [];
    const ids = plans.map((p) => safeExportPlanId(displayContractPbp(p))).filter(Boolean).join("_");
    const name = payload && payload.clientName
      ? safeExportPlanId(String(payload.clientName).replace(/\s+/g, "_"))
      : "";
    const base = name
      ? name + "_Plan_Comparison" + (ids ? "_" + ids : "")
      : "Plan_Comparison" + (ids ? "_" + ids : "");
    return base + "." + (ext || "xlsx");
  }

  function makeStyle(partial) {
    return partial;
  }

  function buildComparisonModel(plansOrPayload, meta) {
    const payload = normalizeExportPayload(plansOrPayload, meta);
    const plans = payload.plans || [];
    const doctors = normalizeDoctors(payload.doctors, plans);
    const drugs = normalizeDrugs(payload.drugs, plans).length
      ? normalizeDrugs(payload.drugs, plans)
      : extractDrugs(
          typeof payload.threadText === "string" ? payload.threadText : "",
          plans
        );
    const headers = ["", ...plans.map(formatPlanColumnHeader)];
    const aoa = [];
    const merges = [];
    const hyperlinks = [];
    const styles = {};
    const kinds = []; // parallel to aoa: row of cell kinds
    const colCount = headers.length;

    const push = (row, rowKinds, rowStyles) => {
      const r = aoa.length;
      aoa.push(row);
      kinds.push(rowKinds || row.map(() => "text"));
      if (rowStyles) {
        rowStyles.forEach((s, c) => {
          if (s) styles[r + "," + c] = s;
        });
      }
      return r;
    };

    const title = payload.clientName || "";
    if (title) {
      const r = push([title, ...plans.map(() => "")], ["title", ...plans.map(() => "title")]);
      if (colCount > 1) merges.push({ s: { r, c: 0 }, e: { r, c: colCount - 1 } });
      styles[r + ",0"] = makeStyle({
        font: { bold: true, sz: 16, color: { rgb: TITLE_COLOR } },
        alignment: { vertical: "center" },
      });
    }

    if (payload.terminatingPlan) {
      push(
        ["Plan Terminating", payload.terminatingPlan, ...plans.slice(1).map(() => "")],
        ["label", "text", ...plans.slice(1).map(() => "text")]
      );
      const r = aoa.length - 1;
      if (colCount > 2) merges.push({ s: { r, c: 1 }, e: { r, c: colCount - 1 } });
      styles[r + ",0"] = makeStyle({ font: { bold: true } });
    }

    const headerStyle = makeStyle({
      font: { bold: true, color: { rgb: PURPLE_FONT }, sz: 11 },
      fill: { patternType: "solid", fgColor: { rgb: PURPLE } },
      alignment: { wrapText: true, vertical: "center", horizontal: "center" },
    });

    const pushPlanHeaders = () => {
      const r = push(headers, ["label", ...plans.map(() => "header")]);
      for (let c = 1; c < colCount; c++) styles[r + "," + c] = headerStyle;
      styles[r + ",0"] = makeStyle({
        fill: { patternType: "solid", fgColor: { rgb: PURPLE } },
        font: { bold: true, color: { rgb: PURPLE_FONT } },
      });
      return r;
    };

    pushPlanHeaders();

    if (doctors.length) {
      const r = push(["Doctors", ...plans.map(() => "")], ["section", ...plans.map(() => "section")]);
      styles[r + ",0"] = makeStyle({
        font: { bold: true, sz: 12 },
        fill: { patternType: "solid", fgColor: { rgb: SECTION_FILL } },
      });
      for (let c = 1; c < colCount; c++) {
        styles[r + "," + c] = makeStyle({ fill: { patternType: "solid", fgColor: { rgb: SECTION_FILL } } });
      }
      doctors.forEach((doc) => {
        const values = [doc.name, ...doc.statuses];
        const rowKinds = ["label", ...doc.statuses.map((s) => (s === NETWORK_IN ? "in" : s === NETWORK_OUT ? "out" : "text"))];
        const rowStyles = [makeStyle({ font: { bold: true } })];
        doc.statuses.forEach((s) => {
          if (s === NETWORK_IN) {
            rowStyles.push(makeStyle({ font: { color: { rgb: GREEN }, bold: true } }));
          } else if (s === NETWORK_OUT) {
            rowStyles.push(makeStyle({ font: { color: { rgb: RED } } }));
          } else {
            rowStyles.push(null);
          }
        });
        push(values, rowKinds, rowStyles);
      });
    }

    if (drugs.length) {
      const r = push(["Medications", ...plans.map(() => "")], ["section", ...plans.map(() => "section")]);
      styles[r + ",0"] = makeStyle({
        font: { bold: true, sz: 12 },
        fill: { patternType: "solid", fgColor: { rgb: SECTION_FILL } },
      });
      for (let c = 1; c < colCount; c++) {
        styles[r + "," + c] = makeStyle({ fill: { patternType: "solid", fgColor: { rgb: SECTION_FILL } } });
      }
      drugs.forEach((drug) => {
        const statuses = plans.map((p) => {
          const id = displayContractPbp(p);
          const rawId = String(p.planId || p.id || "");
          return (drug.byPlanId && (drug.byPlanId[id] || drug.byPlanId[rawId])) || { verified: false };
        });
        const cells = statuses.map((s, i) => formatDrugCell(s, plans[i]));
        const values = [drug.name, ...cells];
        const rowKinds = ["label", ...cells.map((c) => (c === "Unverified" ? "pending" : "text"))];
        const rowStyles = [makeStyle({ font: { bold: true } })];
        cells.forEach((c) => {
          rowStyles.push(
            c === "Unverified"
              ? makeStyle({ font: { color: { rgb: RED } } })
              : makeStyle({ alignment: { wrapText: true, vertical: "top" } })
          );
        });
        push(values, rowKinds, rowStyles);
      });
    }

    if (doctors.length || drugs.length) {
      pushPlanHeaders();
    }

    FIELD_ROWS.forEach(([label, key]) => {
      const values = [label, ...plans.map((p) => formatBenefitValue(p[key], key))];
      const highlight = HIGHLIGHT_KEYS[key];
      const rowKinds = ["label", ...plans.map(() => (highlight ? "highlight" : "text"))];
      const rowStyles = [makeStyle({ font: { bold: true } })];
      plans.forEach(() => {
        rowStyles.push(
          highlight
            ? makeStyle({
                fill: { patternType: "solid", fgColor: { rgb: YELLOW } },
                alignment: { wrapText: true, vertical: "top" },
              })
            : makeStyle({ alignment: { wrapText: true, vertical: "top" } })
        );
      });
      push(values, rowKinds, rowStyles);
    });

    const sobRow = ["Summary of Benefits"];
    const sobKinds = ["label"];
    const sobStyles = [makeStyle({ font: { bold: true } })];
    plans.forEach((p) => {
      const cell = formatSobCell(p);
      sobRow.push(cell.text);
      if (cell.url) {
        sobKinds.push("link");
        sobStyles.push(makeStyle({ font: { color: { rgb: LINK_BLUE }, underline: true } }));
        hyperlinks.push({ r: aoa.length, c: sobRow.length - 1, url: cell.url, text: cell.text });
      } else {
        sobKinds.push("pending");
        sobStyles.push(null);
      }
    });
    push(sobRow, sobKinds, sobStyles);

    const eocRow = ["Evidence of Coverage"];
    const eocKinds = ["label"];
    const eocStyles = [makeStyle({ font: { bold: true } })];
    plans.forEach((p) => {
      const cell = formatEocCell(p);
      eocRow.push(cell.text);
      if (cell.url) {
        eocKinds.push("link");
        eocStyles.push(makeStyle({ font: { color: { rgb: LINK_BLUE }, underline: true } }));
        hyperlinks.push({ r: aoa.length, c: eocRow.length - 1, url: cell.url, text: cell.text });
      } else {
        eocKinds.push("pending");
        eocStyles.push(null);
      }
    });
    push(eocRow, eocKinds, eocStyles);

    return {
      payload,
      title,
      aoa,
      kinds,
      merges,
      hyperlinks,
      styles,
      headers,
      doctors,
      drugs,
      filenameXlsx: comparisonExportFilename(payload, "xlsx"),
      filenamePdf: comparisonExportFilename(payload, "pdf"),
      cols: [{ wch: 28 }, ...plans.map(() => ({ wch: 36 }))],
    };
  }

  function applySheetExtras(ws, model) {
    ws["!cols"] = model.cols;
    ws["!merges"] = model.merges;
    const rowHeights = model.aoa.map((row, r) => {
      const header = (model.kinds[r] || []).includes("header");
      const wrapped = row.some((cell) => String(cell || "").includes("\n"));
      if (header) return { hpt: 36 };
      if (wrapped) return { hpt: 32 };
      if (r === 0 && model.title) return { hpt: 24 };
      return { hpt: 18 };
    });
    ws["!rows"] = rowHeights;
    model.hyperlinks.forEach((h) => {
      const addr = (typeof XLSX !== "undefined" && XLSX.utils ? XLSX.utils.encode_cell({ r: h.r, c: h.c }) : null);
      if (!addr || !ws[addr]) return;
      ws[addr].l = { Target: h.url, Tooltip: h.text || h.url };
    });
    Object.keys(model.styles).forEach((key) => {
      const parts = key.split(",");
      const r = Number(parts[0]);
      const c = Number(parts[1]);
      const addr = typeof XLSX !== "undefined" && XLSX.utils ? XLSX.utils.encode_cell({ r, c }) : null;
      if (!addr || !ws[addr]) return;
      ws[addr].s = model.styles[key];
    });
  }

  function getXlsx() {
    if (typeof XLSX !== "undefined") return XLSX;
    if (typeof window !== "undefined" && window.XLSX) return window.XLSX;
    return null;
  }

  function exportComparisonToExcel(plansOrPayload, meta) {
    const X = getXlsx();
    if (!X) {
      if (typeof alert === "function") alert("Export library didn't load -- please refresh and try again.");
      return null;
    }
    const model = buildComparisonModel(plansOrPayload, meta);
    if (!model.payload.plans.length) return null;
    const ws = X.utils.aoa_to_sheet(model.aoa);
    applySheetExtras(ws, model);
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, "Comparison");
    X.writeFile(wb, model.filenameXlsx);
    return model;
  }

  function getJsPdf() {
    const g = typeof window !== "undefined" ? window : typeof globalThis !== "undefined" ? globalThis : {};
    if (g.jspdf && g.jspdf.jsPDF) return g.jspdf.jsPDF;
    if (g.jsPDF) return g.jsPDF;
    return null;
  }

  function exportComparisonToPdf(plansOrPayload, meta) {
    const JsPDF = getJsPdf();
    if (!JsPDF) {
      if (typeof alert === "function") alert("PDF library didn't load -- please refresh and try again.");
      return null;
    }
    const model = buildComparisonModel(plansOrPayload, meta);
    if (!model.payload.plans.length) return null;
    const planCount = model.payload.plans.length;
    const landscape = planCount >= 2;
    const doc = new JsPDF({ orientation: landscape ? "landscape" : "portrait", unit: "pt", format: "letter" });
    const margin = 28;
    let y = 36;
    if (model.title) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.setTextColor(42, 21, 64);
      doc.text(model.title, margin, y);
      y += 18;
    }
    if (model.payload.terminatingPlan) {
      doc.setFontSize(10);
      doc.setTextColor(40, 40, 40);
      doc.setFont("helvetica", "bold");
      doc.text("Plan Terminating", margin, y);
      doc.setFont("helvetica", "normal");
      doc.text(String(model.payload.terminatingPlan), margin + 110, y);
      y += 14;
    }

    // Use rows from first plan-header onward
    let start = 0;
    for (let i = 0; i < model.aoa.length; i++) {
      if ((model.kinds[i] || [])[1] === "header") {
        start = i;
        break;
      }
    }
    const tableRows = model.aoa.slice(start + 1);
    const tableKinds = model.kinds.slice(start + 1);

    if (typeof doc.autoTable !== "function") {
      // Fallback: simple text table so PDF still downloads
      doc.setFontSize(9);
      model.aoa.forEach((row) => {
        if (y > 560) {
          doc.addPage();
          y = 36;
        }
        doc.text(row.map((c) => String(c || "").replace(/\n/g, " · ")).join("   |   "), margin, y, { maxWidth: 720 });
        y += 14;
      });
      doc.save(model.filenamePdf);
      return model;
    }

    doc.autoTable({
      startY: y + 4,
      head: [model.headers.map((h) => String(h || ""))],
      body: tableRows.map((row) => row.map((c) => String(c == null ? "" : c))),
      theme: "grid",
      styles: { fontSize: 8, cellPadding: 3, valign: "top", overflow: "linebreak" },
      headStyles: { fillColor: [91, 44, 139], textColor: 255, fontStyle: "bold", halign: "center" },
      columnStyles: { 0: { cellWidth: 120, fontStyle: "bold" } },
      didParseCell: function (data) {
        if (data.section !== "body") return;
        const kindRow = tableKinds[data.row.index] || [];
        const kind = kindRow[data.column.index];
        if (kind === "in") {
          data.cell.styles.textColor = [27, 122, 58];
          data.cell.styles.fontStyle = "bold";
        } else if (kind === "out") {
          data.cell.styles.textColor = [155, 28, 60];
        } else if (kind === "highlight") {
          data.cell.styles.fillColor = [255, 242, 168];
        } else if (kind === "section") {
          data.cell.styles.fillColor = [243, 238, 247];
          data.cell.styles.fontStyle = "bold";
        } else if (kind === "header") {
          data.cell.styles.fillColor = [91, 44, 139];
          data.cell.styles.textColor = 255;
          data.cell.styles.fontStyle = "bold";
        } else if (kind === "link") {
          data.cell.styles.textColor = [5, 99, 193];
        }
      },
      didDrawCell: function (data) {
        if (data.section !== "body") return;
        const kindRow = tableKinds[data.row.index] || [];
        if (kindRow[data.column.index] !== "link") return;
        const aoaRow = start + 1 + data.row.index;
        const link = model.hyperlinks.find((h) => h.r === aoaRow && h.c === data.column.index);
        if (link) {
          doc.link(data.cell.x, data.cell.y, data.cell.width, data.cell.height, { url: link.url });
        }
      },
      margin: { left: margin, right: margin },
    });

    doc.save(model.filenamePdf);
    return model;
  }

  function wantsComparisonExport(text) {
    const t = String(text || "");
    return (
      /\b(excel|xlsx|spreadsheet|pdf)\b/i.test(t) ||
      /\bexport\s+(this|it|that|to|as|in)\b/i.test(t) ||
      (/\bside[-\s]?by[-\s]?side\b/i.test(t) && /\b(excel|export|sheet|pdf)\b/i.test(t))
    );
  }

  function wantsExcelExport(text) {
    return wantsComparisonExport(text);
  }

  function conversationPlainText(messages, userMessageTextFn) {
    const toText =
      typeof userMessageTextFn === "function"
        ? userMessageTextFn
        : function (content) {
            if (typeof content === "string") return content;
            if (Array.isArray(content)) {
              return content
                .map((part) => (typeof part === "string" ? part : (part && part.text) || ""))
                .filter(Boolean)
                .join("\n");
            }
            return String(content || "");
          };
    return (messages || [])
      .filter((m) => m && m.role !== "offer" && m.role !== "workup")
      .map((m) => toText(m.content))
      .filter(Boolean)
      .join("\n");
  }

  return {
    FIELD_ROWS,
    HIGHLIGHT_KEYS,
    NETWORK_IN,
    NETWORK_OUT,
    NETWORK_NOT_CONFIRMED,
    NETWORK_NEED_MORE,
    formatBenefitValue,
    formatPlanMarketingName,
    formatPlanColumnHeader,
    displayContractPbp,
    safeExportPlanId,
    extractClientName,
    extractTerminatingPlan,
    extractDoctors,
    normalizeDoctors,
    extractDrugs,
    extractClaimedMeds,
    extractVerifiedLookups,
    parseFormularyLookupLine,
    normalizeDrugs,
    formatDrugCell,
    normalizeNetworkStatus,
    normalizeExportPayload,
    buildExportPayload,
    buildComparisonModel,
    comparisonExportFilename,
    exportComparisonToExcel,
    exportComparisonToPdf,
    wantsComparisonExport,
    wantsExcelExport,
    conversationPlainText,
    formatSobCell,
    formatEocCell,
  };
});
</script>

<script>
/**
 * Structured client workups (Yahoska / Muskat-style comps).
 * Browser (window.MaxClientWorkups) + Node tests.
 * Never stores or resumes a full chat transcript.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  if (root && typeof root === "object") root.MaxClientWorkups = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const WORKUP_CONTEXT_PREFIX = "LOADED CLIENT WORKUP";
  const NETWORK_IN = "IN";
  const NETWORK_OUT = "OUT";
  const NETWORK_NOT_CONFIRMED = "NOT CONFIRMED";
  const NETWORK_NEED_MORE = "NEED MORE INFO";

  function clip(value, max) {
    const s = String(value == null ? "" : value).replace(/\s+/g, " ").trim();
    return s.slice(0, max);
  }

  function displayPlanId(plan) {
    let id = String((plan && (plan.planId || plan.id)) || "").replace(/\s+/g, "");
    id = id.replace(/-000$/i, "").replace(/\/000$/i, "");
    return id;
  }

  function marketingLabel(plan) {
    if (!plan) return "";
    const name = [plan.carrier, plan.planName].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
    const id = displayPlanId(plan);
    if (name && id) return name + " (" + id + ")";
    return name || id;
  }

  function normalizeNetworkBucket(raw) {
    if (raw === true) return NETWORK_IN;
    if (raw === false) return NETWORK_OUT;
    const s = String(raw || "").trim();
    if (!s) return "";
    const upper = s.toUpperCase();
    if (upper === NETWORK_IN || upper === NETWORK_OUT || upper === NETWORK_NOT_CONFIRMED || upper === NETWORK_NEED_MORE) {
      return upper;
    }
    if (/need\s*more\s*info/i.test(s)) return NETWORK_NEED_MORE;
    if (/not\s*confirmed/i.test(s)) return NETWORK_NOT_CONFIRMED;
    if (/^(in[-\s]?network|inn|in|true|yes)$/i.test(s) || /\bin[-\s]?network\b/i.test(s)) return NETWORK_IN;
    if (/^(out(?:\s+of)?[-\s]?network|oon|out|false|no)$/i.test(s) || /\bout(?:\s+of)?[-\s]?network\b/i.test(s)) {
      return NETWORK_OUT;
    }
    return "";
  }

  function bucketToExportStatus(bucket) {
    if (bucket === NETWORK_IN) return "In network";
    if (bucket === NETWORK_OUT) return "Out of network";
    if (bucket === NETWORK_NOT_CONFIRMED) return "Not confirmed";
    if (bucket === NETWORK_NEED_MORE) return "Need more info";
    return "";
  }

  function extractZip(text) {
    const t = String(text || "");
    const fl = t.match(/\b(3[0-4]\d{3})(?:-\d{4})?\b/);
    if (fl) return fl[1];
    const any = t.match(/\b(\d{5})(?:-\d{4})?\b/);
    return any ? any[1] : "";
  }

  function extractCounty(text) {
    const t = String(text || "");
    if (/\bmiami[- ]?dade\b|\bdade\b/i.test(t)) return "Miami-Dade";
    if (/\bbroward\b/i.test(t)) return "Broward";
    if (/\bpalm\s*beach\b/i.test(t)) return "Palm Beach";
    return "";
  }

  function extractContacts(text) {
    const t = String(text || "");
    const labeled = t.match(/\bcontacts?\s*[:=]\s*([^\n]{3,200})/i);
    if (labeled) return clip(labeled[1], 200);
    const phone = t.match(/\b(\d{3}[-.\s]\d{3}[-.\s]\d{4})\b/);
    return phone ? phone[1] : "";
  }

  function extractNeeds(text) {
    const t = String(text || "");
    const labeled = t.match(/\b(?:needs?|looking for|priorities)\s*[:=]\s*([^\n]{3,300})/i);
    if (!labeled) return [];
    return labeled[1]
      .split(/[;,•]/)
      .map((s) => clip(s, 120))
      .filter(Boolean)
      .slice(0, 8);
  }

  function slimPlan(plan) {
    if (!plan || typeof plan !== "object") return null;
    const planId = clip(plan.planId || plan.id || "", 40);
    if (!planId) return null;
    return {
      planId: planId,
      id: clip(plan.id || plan.planId || "", 40),
      planName: clip(plan.planName || "", 120),
      carrier: clip(plan.carrier || "", 80),
      county: clip(plan.county || "", 40),
    };
  }

  function doctorsFromExport(payload) {
    const plans = (payload && payload.plans) || [];
    const doctors = (payload && payload.doctors) || [];
    const out = [];
    doctors.forEach((d) => {
      if (!d || typeof d !== "object") return;
      const name = clip(d.name || "", 80);
      if (!name) return;
      const byPlanId = {};
      if (d.byPlanId && typeof d.byPlanId === "object") {
        Object.keys(d.byPlanId).forEach((id) => {
          const bucket = normalizeNetworkBucket(d.byPlanId[id]);
          if (bucket) byPlanId[id] = bucket;
        });
      }
      if (Array.isArray(d.statuses)) {
        d.statuses.forEach((status, i) => {
          const plan = plans[i];
          const bucket = normalizeNetworkBucket(status);
          if (bucket && plan) byPlanId[displayPlanId(plan)] = bucket;
        });
      }
      if (Object.keys(byPlanId).length) out.push({ name: name, byPlanId: byPlanId });
    });
    return out;
  }

  function medicationsFromExport(payload) {
    const drugs = (payload && payload.drugs) || [];
    const out = [];
    drugs.forEach((d) => {
      if (!d || typeof d !== "object") return;
      if (d.claimedTier != null) {
        /* discarded forever — never copy Daisy / client-stated tiers */
      }
      const name = clip(d.name || d.drug || "", 48);
      if (!name) return;
      const map = d.byPlanId || {};
      const byPlanId = {};
      Object.keys(map).forEach((id) => {
        const incoming = map[id] || {};
        if (!incoming.verified) return;
        const tier = Number(incoming.tier);
        const coverage = incoming.coverage === "not_covered" ? "not_covered" : incoming.coverage || null;
        if (!(tier >= 1 && tier <= 6) && coverage !== "not_covered") return;
        byPlanId[id] = {
          verified: true,
          tier: tier >= 1 && tier <= 6 ? tier : null,
          coverage: coverage,
          costShare: incoming.costShare ? clip(incoming.costShare, 40) : null,
          pa: incoming.pa === true ? true : incoming.pa === false ? false : null,
          st: incoming.st === true ? true : incoming.st === false ? false : null,
          source: incoming.source ? clip(incoming.source, 40) : null,
        };
      });
      if (Object.keys(byPlanId).length) out.push({ name: name, byPlanId: byPlanId });
    });
    return out;
  }

  function buildWorkupFromExport(payload, extras) {
    const extra = extras && typeof extras === "object" ? extras : {};
    const src = payload && typeof payload === "object" ? payload : {};
    const thread = extra.threadText || "";
    const plans = (Array.isArray(src.plans) ? src.plans : []).map(slimPlan).filter(Boolean).slice(0, 6);
    const clientName = clip(extra.clientName || src.clientName || "", 80);
    const zip = clip(extra.zip || src.zip || extractZip(thread), 10);
    const county = clip(extra.county || src.county || extractCounty(thread) || (plans[0] && plans[0].county) || "", 40);
    const contacts = clip(extra.contacts || src.contacts || extractContacts(thread), 200);
    const needs = Array.isArray(extra.needs) && extra.needs.length ? extra.needs.map((n) => clip(n, 120)).filter(Boolean).slice(0, 8) : extractNeeds(thread);
    const terminatingPlan = clip(extra.terminatingPlan || src.terminatingPlan || "", 90);
    return {
      id: extra.id || src.id || "",
      clientName: clientName,
      zip: zip,
      county: county,
      contacts: contacts,
      plans: plans,
      planIds: plans.map((p) => p.planId),
      doctors: doctorsFromExport(src),
      medications: medicationsFromExport(src),
      needs: needs,
      terminatingPlan: terminatingPlan,
    };
  }

  function planIdKey(value) {
    return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  }

  function planMatches(catalogPlan, slim) {
    const want = planIdKey(slim.planId || slim.id);
    if (!want) return false;
    const pid = planIdKey(catalogPlan.planId);
    const id = planIdKey(catalogPlan.id);
    const hit = (pid && (pid === want || pid.indexOf(want) >= 0 || want.indexOf(pid) >= 0)) || (id && (id === want || id.indexOf(want) >= 0 || want.indexOf(id) >= 0));
    if (!hit) return false;
    if (slim.county && catalogPlan.county && slim.county !== catalogPlan.county) return false;
    return true;
  }

  function rehydratePlans(workupPlans, catalog) {
    const slims = Array.isArray(workupPlans) ? workupPlans : [];
    const list = Array.isArray(catalog) ? catalog : [];
    return slims.map((slim) => {
      const match = list.find((p) => planMatches(p, slim));
      return match || slim;
    });
  }

  function workupToExportPayload(workup, catalog) {
    const w = workup && typeof workup === "object" ? workup : {};
    const plans = rehydratePlans(w.plans, catalog);
    const doctors = (w.doctors || []).map((d) => ({
      name: d.name,
      byPlanId: Object.fromEntries(
        Object.entries(d.byPlanId || {}).map(([id, bucket]) => [id, bucketToExportStatus(bucket)])
      ),
    }));
    const drugs = (w.medications || []).map((m) => ({
      name: m.name,
      byPlanId: m.byPlanId || {},
    }));
    return {
      plans: plans,
      clientName: w.clientName || "",
      terminatingPlan: w.terminatingPlan || "",
      doctors: doctors,
      drugs: drugs,
    };
  }

  function compactWorkupContext(workup) {
    const w = workup && typeof workup === "object" ? workup : {};
    const lines = [
      WORKUP_CONTEXT_PREFIX + " (structured facts only — not a prior chat transcript). Continue this comparison. Do not ask to re-paste Daisy. Discard any client-stated Rx tiers. Call lookup_formulary for any unverified drug × named plan.",
    ];
    if (w.clientName) lines.push("Client: " + w.clientName);
    const place = [w.zip, w.county].filter(Boolean).join(" / ");
    if (place) lines.push("ZIP/county: " + place);
    if (w.contacts) lines.push("Contacts: " + w.contacts);
    const plans = w.plans || [];
    if (plans.length) {
      lines.push("Plans:");
      plans.forEach((p) => lines.push("- " + marketingLabel(p)));
    }
    const doctors = w.doctors || [];
    if (doctors.length) {
      lines.push("Doctors:");
      doctors.forEach((d) => {
        const bits = Object.keys(d.byPlanId || {}).map((id) => id + " " + d.byPlanId[id]);
        lines.push("- " + d.name + (bits.length ? ": " + bits.join("; ") : ""));
      });
    }
    const meds = w.medications || [];
    if (meds.length) {
      lines.push("Medications (verified formulary only):");
      meds.forEach((m) => {
        const bits = Object.keys(m.byPlanId || {}).map((id) => {
          const st = m.byPlanId[id] || {};
          if (st.coverage === "not_covered") return id + " Not covered";
          const cost = st.costShare ? " · " + st.costShare : "";
          return id + " Tier " + (st.tier || "?") + cost;
        });
        lines.push("- " + m.name + (bits.length ? ": " + bits.join("; ") : ""));
      });
    }
    const needs = w.needs || [];
    if (needs.length) {
      lines.push("Needs:");
      needs.forEach((n) => lines.push("- " + n));
    }
    if (w.terminatingPlan) lines.push("Plan Terminating: " + w.terminatingPlan);
    return lines.join("\n");
  }

  function isWorkupContextMessage(content) {
    const text = typeof content === "string" ? content : "";
    return text.indexOf(WORKUP_CONTEXT_PREFIX) === 0;
  }

  function messagesForApi(history, loadedWorkup) {
    const chat = (history || [])
      .filter((m) => m && (m.role === "user" || m.role === "assistant"))
      .map((m) => ({ role: m.role, content: m.content }));
    if (!loadedWorkup) return chat;
    const compact = compactWorkupContext(loadedWorkup);
    if (!compact) return chat;
    if (chat[0] && chat[0].role === "user" && isWorkupContextMessage(chat[0].content)) return chat;
    return [{ role: "user", content: compact }].concat(chat);
  }

  function workupListLabel(workup) {
    if (workup && workup.clientName) return workup.clientName;
    const ids = ((workup && workup.planIds) || []).slice(0, 2).join(" / ");
    return ids ? "Unnamed — " + ids : "Unnamed workup";
  }

  function formatUpdatedAt(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    } catch (_) {
      return "";
    }
  }

  return {
    WORKUP_CONTEXT_PREFIX,
    NETWORK_IN,
    NETWORK_OUT,
    NETWORK_NOT_CONFIRMED,
    NETWORK_NEED_MORE,
    normalizeNetworkBucket,
    bucketToExportStatus,
    extractZip,
    extractCounty,
    extractContacts,
    extractNeeds,
    buildWorkupFromExport,
    workupToExportPayload,
    compactWorkupContext,
    isWorkupContextMessage,
    messagesForApi,
    workupListLabel,
    formatUpdatedAt,
    rehydratePlans,
  };
});
</script>

// Finds plan records referenced in a message by matching literal plan IDs against PLANS --
// never parses chat prose for values. Uses a county mention in the text to disambiguate
// plans that exist in both Miami-Dade and Broward (e.g. H0982-022).
function normalizePlanIdKey(s) {
  // H5420-001/0028, H5420-001/-0028, H5420-001/ 0028 → comparable tokens
  return String(s || "")
    .toUpperCase()
    .replace(/\s+/g, "")
    .replace(/\/+/g, "/")
    .replace(/\/-/g, "/");
}

function planIdMatchesRaw(plan, raw) {
  const rawKey = normalizePlanIdKey(raw);
  const ids = [plan.planId, plan.id].filter(Boolean).map(normalizePlanIdKey);
  for (const id of ids) {
    if (id === rawKey) return true;
    // Max often cites H5420-001/0028 while grid stores H5420-001/-0028 or H5420-001/ 0028
    if (id.startsWith(rawKey + "/") || rawKey.startsWith(id + "/")) return true;
    // Also match bare contract-PBP prefix: H5420-001 vs H5420-001/0028
    const rawBase = rawKey.split("/")[0];
    const idBase = id.split("/")[0];
    if (rawBase && idBase && rawBase === idBase) return true;
  }
  return false;
}

function findComparisonPlans(text) {
  if (!text) return [];
  const hasBroward = /broward/i.test(text);
  const hasDade = /miami-?dade/i.test(text);
  const countyHint = hasBroward && !hasDade ? "Broward" : (hasDade && !hasBroward ? "Miami-Dade" : null);
  // Capture compound IDs like H5420-001/0028 as well as H5420-001
  const idRegex = /\b[HR]\d{3,4}[\s-]?\d{2,4}(?:\s*\/\s*-?\d{2,4})?\b/g;
  const rawMatches = [...new Set((text.match(idRegex) || []).map((s) => s.replace(/\s+/g, "")))];
  const found = [];
  const seen = new Set();
  for (const raw of rawMatches) {
    let candidates = PLANS.filter((p) => planIdMatchesRaw(p, raw));
    if (candidates.length === 0) continue;
    if (candidates.length > 1 && countyHint) {
      const filtered = candidates.filter((p) => p.county === countyHint);
      if (filtered.length) candidates = filtered;
    }
    const plan = candidates[0];
    const key = plan.planId + "|" + plan.county;
    if (!seen.has(key)) {
      seen.add(key);
      found.push(plan);
    }
  }
  return found;
}

const ALLOWED_ATTACH_TYPES = ["image/png", "image/jpeg", "image/webp"];

function userMessageText(content) {
  if (typeof content === "string") {
    return content.trim().startsWith("data:image/") ? "" : String(content || "");
  }
  if (!Array.isArray(content)) return String(content || "");
  return content
    .map((part) => {
      if (typeof part === "string") return part.trim().startsWith("data:image/") ? "" : part;
      return part && (part.type === "text" || typeof part.text === "string") ? part.text || "" : "";
    })
    .filter(Boolean)
    .join("\n");
}

function userMessageImages(content) {
  if (typeof content === "string") {
    return content.trim().startsWith("data:image/") ? [content] : [];
  }
  if (!Array.isArray(content)) return [];
  return content
    .map((part) => {
      if (typeof part === "string" && part.trim().startsWith("data:image/")) return part;
      if (part && part.type === "image_url") {
        return typeof part.image_url === "string" ? part.image_url : part.image_url && part.image_url.url;
      }
      return "";
    })
    .filter(Boolean);
}

function conversationAskText(conversationHistory) {
  const msgs = Array.isArray(conversationHistory) ? conversationHistory : [];
  // Prefer latest user turns (last 4 user messages) so follow-ups keep context
  const users = msgs.filter((m) => m && m.role === "user").map((m) => userMessageText(m.content));
  const recent = users.slice(-4);
  return recent.join("\n");
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("Could not read that image."));
    reader.readAsDataURL(file);
  });
}

function detectCounties(text) {
  const t = String(text || "").toLowerCase();
  const wantsBoth =
    /\b(both\s+counties|south\s*florida|s\.?\s*fla?|miami[- ]?dade\s+and\s+broward|broward\s+and\s+miami)\b/.test(t) ||
    (/\bmiami[- ]?dade\b|\bdade\b/.test(t) && /\bbroward\b/.test(t));
  if (wantsBoth) return ["Miami-Dade", "Broward"];
  const out = [];
  if (/\bmiami[- ]?dade\b|\bdade\b|\bmiami\b/.test(t)) out.push("Miami-Dade");
  if (/\bbroward\b/.test(t)) out.push("Broward");
  return out;
}

function detectCarriers(text) {
  const t = String(text || "");
  return CARRIER_ALIASES.filter((a) => a.re.test(t)).map((a) => a.match);
}

function detectPlanIds(text) {
  const t = String(text || "");
  const ids = new Set();
  const re = /\bH\d{3,4}\s*[-–\/]?\s*\d{2,4}(?:\s*\/\s*\d{2,4})?\b/gi;
  let m;
  while ((m = re.exec(t))) {
    ids.add(m[0].replace(/\s+/g, "").replace(/–/g, "-").toUpperCase());
  }
  return [...ids];
}

function looksLikePlanGridAsk(text) {
  const t = String(text || "").toLowerCase();
  // Plan IDs / carriers / counties always mean we need grid rows
  if (detectPlanIds(t).length > 0 || detectCarriers(t).length > 0 || detectCounties(t).length > 0 || detectPlanNameHints(t).length > 0) {
    return true;
  }
  // General Medicare education — no plan grid needed
  if (
    /\b(what is|what's|explain|how does|define)\b/.test(t) &&
    /\b(part\s*[abcd]|irmaa|moop|deductible|sep|aep|oep|lis|medicaid|msp|qmb|slmb)\b/.test(t) &&
    !/\b(plan|plans|giveback|otc|dental|crowns?|bridges?|implants?|dentures?|carrier|humana|careplus|devoted|doctors|uhc|aetna|h\d{3,4})\b/.test(t)
  ) {
    return false;
  }
  return /\b(plan|plans|giveback|give\s*back|otc|dental|crowns?|bridges?|implants?|dentures?|fillings?|root\s*canals?|extractions?|deep\s*clean|moop|premium|copay|compare|vs\.?|versus|list|which|carrier|hmo|dsnp|d-snp|csnp|c-snp|ppo|network|hospital|sob|formulary|tier\s*[1-6]|specialist|pcp|hearing|vision|transport|grocery|food\s*card)\b/i.test(t);
}

const PLAN_NAME_HINTS = [
  { re: /\bcare\s*complete\b/i, match: (n) => /care\s*complete/i.test(n) },
  { re: /\bcare\s*breeze\b/i, match: (n) => /care\s*breeze/i.test(n) },
  { re: /\bcare\s*one\b/i, match: (n) => /care\s*one/i.test(n) },
  { re: /\bcare\s*needs\b/i, match: (n) => /care\s*needs/i.test(n) },
  { re: /\bcare\s*free\b/i, match: (n) => /care\s*free/i.test(n) },
  { re: /\bcare\s*access\b/i, match: (n) => /care\s*access/i.test(n) },
];

function detectPlanNameHints(text) {
  const t = String(text || "");
  return PLAN_NAME_HINTS.filter((a) => a.re.test(t)).map((a) => a.match);
}

function selectPlansForAsk(conversationHistory) {
  const text = conversationAskText(conversationHistory);
  const counties = detectCounties(text);
  const carrierMatchers = detectCarriers(text);
  const planNameMatchers = detectPlanNameHints(text);
  const planIds = detectPlanIds(text);
  const wantsFull =
    /\b(all\s+plans|full\s+grid|every\s+plan|entire\s+grid|both\s+counties|south\s*florida|s\.?\s*fla?)\b/i.test(text);

  // Named plan IDs win
  let filtered = PLANS.slice();
  if (planIds.length) {
    const norm = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const wanted = planIds.map(norm);
    filtered = PLANS.filter((p) => {
      const pid = norm(p.planId);
      const id = norm(p.id);
      return wanted.some((w) => (pid && (pid === w || pid.includes(w) || w.includes(pid))) || (id && (id === w || id.includes(w) || w.includes(id))));
    });
  } else {
    if (counties.length) {
      filtered = filtered.filter((p) => counties.includes(p.county));
    }
    if (carrierMatchers.length) {
      filtered = filtered.filter((p) => carrierMatchers.some((fn) => fn(String(p.carrier || ""))));
    }
    if (planNameMatchers.length) {
      filtered = filtered.filter((p) => planNameMatchers.some((fn) => fn(String(p.planName || ""))));
    }
  }

  const needsGrid = looksLikePlanGridAsk(text);
  const hasScope = counties.length > 0 || carrierMatchers.length > 0 || planNameMatchers.length > 0 || planIds.length > 0 || wantsFull;

  if (needsGrid && !hasScope) {
    return {
      needClarify: true,
      clarifyMessage:
        "Happy to pull that from the grid — which county should I use, Miami-Dade or Broward? If you already know the carrier or plan ID, toss that in too and I’ll narrow faster.",
      plans: [],
      meta: { counties, carriers: carrierMatchers.length, planIds, matched: 0 },
    };
  }

  // Explicit full South Florida
  if (wantsFull && !planIds.length && !carrierMatchers.length) {
    filtered = PLANS.slice();
  }

  // No plan-grid ask (pure education) → tiny empty plan set; rules still answer Rule 3
  if (!needsGrid) {
    filtered = [];
  }

  if (filtered.length > PLAN_FILTER_CAP && !wantsFull) {
    // Prefer clarifying over dumping a huge set (e.g. carrier-less both-county)
    if (counties.length === 0) {
      return {
        needClarify: true,
        clarifyMessage:
          `That matches a lot of plans (${filtered.length}). Which county — Miami-Dade or Broward? Or name the carrier / plan ID and I’ll pull just those.`,
        plans: [],
        meta: { counties, carriers: carrierMatchers.length, planIds, matched: filtered.length },
      };
    }
    // County-wide over cap is rare (~75); if somehow over, keep county filter as-is
  }

  return {
    needClarify: false,
    clarifyMessage: null,
    plans: filtered,
    meta: {
      counties,
      carriers: carrierMatchers.length,
      planIds,
      matched: filtered.length,
      total: PLANS.length,
    },
  };
}


function buildSystemPrompt(selectedPlans) {
  return `You are Max, the internal Medicare knowledge assistant for The Health Experts Insurance (THEI), a Florida Medicare/health insurance brokerage. You are used ONLY by internal THEI staff and licensed agents -- never by clients directly.

TONE: Warm and professional, like a knowledgeable colleague who's glad to help -- not curt, not overly casual ("Hey! What do you need?" is too blunt), and not stiff or robotic either. The person you're talking to is working, often mid-call or between calls, so get to useful information quickly, but don't skip a friendly, natural opening. Think "helpful coworker who knows the plan grid cold," not "customer service bot."

ANSWER DIRECTLY -- when the data you've been given already contains the answer (e.g. an MSP Levels field, a benefit amount), state it confidently and move on. Do NOT narrate your own checking process ("let me check... actually, looking at the data...") -- that's internal monologue, not something to say out loud. Do NOT add "I'd double-check with the carrier directly" or similar hedges when the grid data is itself the source of truth for this purpose -- only suggest verifying with the carrier for things genuinely outside the data (e.g. whether a specific implant procedure is covered under a dental allowance). Confidence should match the data: if it's in the grid, say it plainly with a citation; if it's not, say that plainly too, without pretending to have checked something you didn't have.

Your job: answer Medicare knowledge questions and specific plan benefit questions accurately, using the real plan data provided below when relevant. PLAN DATA is THEI's 2026 Plan Comparison Grid (current-year coverage). Agents may also ask for 2027 -- if the knowledge base, Hub pack, or a confirmed 2027 SoB note has the fact, answer it and cite plan year 2027. If you do not have that 2027 fact, say so. Never quote 2026 plan dollars as 2027.

HARD RULES -- these override everything else:
1. NEVER rank, recommend, or imply one plan is "best," "better," or "the right choice" for a client. You may state objective facts (e.g. "Plan X has a $500 MOOP and Plan Y has $2,900") but never conclude which is preferable. This is the same TPMO discipline as Elena's live scripts -- the habit matters even in an internal tool.
2. ALWAYS cite your source when answering a plan-specific question: name the carrier, plan name, and plan ID (e.g. "Source: CarePlus CareOne Plus, H1019-006"). If the answer isn't in the provided data, say so plainly rather than guessing.
2b. Some plans have a "sobUrl" field -- a real, live link to that carrier's official published Summary of Benefits PDF. When discussing a specific plan that has one, format it as a proper markdown link with SHORT link text, like this exactly: [SoB](the-actual-url) -- never use the raw URL itself as the visible link text (that renders as an ugly wall of characters). Especially useful for anything not covered in the grid data itself, or when the person wants to verify details or send something to a client. Be clear you have NOT read the contents of that PDF -- you're citing the grid data plus pointing to the official document, not summarizing what's inside it. If a plan has no sobUrl, don't mention one.
2c. The "tags.foodCard" field is a simplified true/false flag that collapses conditional benefits (e.g. "combined with OTC if member qualifies") down to false, since it's not a separate guaranteed dollar amount. Don't rely on that flag alone for food/grocery questions -- check the "groceryCardDetail" field for the real text, and explain the actual condition (e.g. "it's combined with the OTC allowance and only if she qualifies" rather than a flat "no food card"). The nuance matters -- a conditional benefit is still worth mentioning, just accurately framed.
3. General Medicare education (how Part D works, what MOOP means, IRMAA, enrollment periods, etc.) is fine to answer from your own knowledge -- just be accurate and note if something depends on the current plan year.
4. If asked something that requires real member/PHI data (a specific client's account, policy number, enrollment status), say this tool doesn't have access to that -- it only has general plan grid data, not member records. Direct them to MedicarePro/GHL.
5. Keep answers concise and practical -- these are working agents on a call or between calls, not researchers.
6. CONVERSATIONAL PACING -- if a question would match many plans (more than ~4-5), do NOT list them all in one message. Instead: state how many total match, then ask exactly ONE clarifying question to narrow it down -- never a numbered list of multiple questions at once. Wait for that answer before asking anything else or offering any data. Do NOT preview or hint at specific figures (dollar amounts, ranges, plan names) before the clarifying question is answered -- that undermines the point of narrowing first. Once narrowed, show the TOP 3 most competitive plans for what's been asked -- not 5, not 6 -- then ask if they want to see more or narrow further. Pick the 3 best on whatever the person said mattered most (e.g. highest dental allowance if dental was the priority). Only produce a longer list if the person explicitly asks to see everything. Talk like a helpful colleague working through one thing at a time, not a database dump or an interview with a long question list.
7. KEEP IT SHORT -- default to 2-4 sentences, or a couple of short bullet points at most. This is a chat exchange with a colleague, not a report. Skip headers, skip bolding every plan name, skip a bulleted breakdown with 3+ sub-points per item -- just say the answer plainly, like you'd say it out loud. If someone genuinely needs the full detailed breakdown (rare), they'll ask for it explicitly -- default to brief, expand only on request.
8. FILTER EXHAUSTIVELY, NOT BY FAMILIAR NAMES -- when someone gives explicit criteria (a county, an MSP/dual level, a benefit like dental), check EVERY plan in the relevant county/type against ALL of the stated criteria before answering. Do not include a plan that fails one of the stated criteria and then walk it back mid-answer ("actually, skip this one") -- that means you didn't check first. Do not skip a plan that actually qualifies just because it wasn't the first one that came to mind -- go through the data, not your assumptions about which carriers are usually good options. Once you've checked, present ONLY the plans that actually qualify -- do not mention disqualified plans at all, not even as a "skip" note. Do the filtering silently; the person only needs to see the plans that made the cut, not your elimination process. If you're not confident you checked exhaustively, say so and offer to look more carefully, rather than presenting a partial list as complete.
9. NO MARKDOWN TABLES -- the chat interface doesn't render them; they show up as raw pipes and dashes, which is worse than no formatting at all. For side-by-side comparisons, use the short bullet-per-plan format instead (plan name, then a few "label: value" bullets), the same style that's worked well before -- not a table.
10. CONDITIONAL BENEFITS -- when a plan's grocery card, food allowance, or similar benefit says "if member qualifies," don't leave that vague. Check CARRIER_CHRONIC_CONDITIONS for that plan's carrier and explain what actually qualifies someone -- name a couple of relevant conditions if the person mentioned a client's health situation, and flag carrier-specific process requirements (e.g. "Humana needs two qualifying conditions plus a completed HRA on their Sunfire platform, not just one diagnosis"). If the person hasn't mentioned any health conditions for the client, ask before assuming, but don't just repeat "if they qualify" without explaining what qualifying actually means.
11. NON-COMMISSIONABLE STATUS -- if a plan has "nonCommissionable": true, proactively mention this as a neutral fact whenever that plan comes up, even if the person didn't ask -- an agent deciding whether to pursue a sale needs this upfront, not buried. State it plainly using "nonCommissionableNote" for the reason (e.g. "heads up, this one's non-commissionable for new sales -- renewals aren't affected"). This is a fact disclosure, not a ranking signal -- say it the same neutral way you'd state a copay, then keep answering whatever else was asked. Never use non-commissionable status as a reason to steer someone toward or away from a plan (same discipline as Rule 1). If "pendingVerification": true, say the flag itself is confirmed but the specific detail in "verificationNote" is still being confirmed internally -- e.g. "this one's flagged non-commissionable, but the effective date is still being verified with Katy, so double-check before you rely on it for an active deal."
12. PART B GIVEBACK -- if a plan has a "partBGiveback" field, that's a real dollar figure extracted directly from that plan's official SOB PDF (see "partBGivebackSource"), not an estimate. Mention it proactively when discussing premium, giveback, or "what's the deal with this plan" type questions -- agents ask about this a lot and it's easy to undersell a plan by leaving it out. Don't assume a plan has no giveback just because its "type" isn't "Giveback" -- HMO, CSNP, and PPO plans can carry a real Part B reduction too, so always check the field itself rather than the type label. If a plan has no "partBGiveback" field, do NOT say "this plan has no giveback" as a confirmed fact -- say the data doesn't have a giveback figure on file for that plan, since the field is only populated for plans where the SOB was actually checked and a giveback line was found; absence isn't the same as a confirmed zero.
13. EXPANDED DETAIL FIELDS -- most plans also carry deeper fields beyond the core benefits: "rxDeductible", "tier1" through "tier6" (drug cost-sharing tiers), "specialistCopay", "pcpCopay", "erCopay", "urgentCareCopay", "inpatientHospital", "outpatientHospital", "advancedImaging", "ambulance", "acupuncture", "planDeductible", "starRating", and a detailed dental breakdown ("dentalDeepCleaning", "dentalDentures", "dentalFillings", "dentalRootCanals", "dentalExtractions", "dentalCrowns", "dentalBridges", "dentalImplants"). Use these whenever an agent asks something more specific than the core benefit summary -- e.g. "what's her specialist copay" or "does this cover root canals." These fields came from THEI's full master plan grid (not the earlier condensed one) and were spot-checked against official SOBs only where explicitly noted -- most were not individually re-verified the way premium/MOOP/dental/OTC/vision/transportation/hearing/giveback were. Treat them as reliable working data, cite the plan the same way as anything else (Rule 2), but if an agent is about to make a high-stakes decision on one of these newer fields specifically (e.g. quoting an exact specialist copay to a client), it's fair to add a quick "worth double-checking that one against the current SOB" -- not because it's likely wrong, just because it hasn't been through the same verification pass as the core fields. Not every plan has every one of these fields populated -- if a field's missing for a plan, say the data doesn't have it on file, don't guess or assume it's $0.
13b. DENTAL PROCEDURE QUESTIONS (crowns, bridges, implants, dentures, fillings, root canals, extractions, deep cleaning) -- read the matching field FIRST (dentalCrowns, dentalBridges, dentalImplants, dentalDentures, etc.) plus any Crowns/Bridges rows in the 2026/2027 CarePlus KB. Answer the named plan (CMS ID) directly: yes/no + frequency + copay/$0 when the THEI grid has it. Cite carrier + plan name + plan ID + THEI grid (or CarePlus KB). Do NOT answer only "$0 varies". Do NOT dump every chronic / CarePlus C-SNP unless they asked for a comparison. If this county's cell is vague junk ("$0 varies", "varies", "not listed", blank) and the SAME CMS ID in the sibling county (or a CarePlus statewide / SoB note) has a clear frequency or Yes/No, use the clearer sibling value and say so. AFTER the grid answer, you may note SoB/EOC for CDT-level edge cases (prior auth, specific codes). Do not lead with a SoB hedge and do not send the agent to ChatGPT. Search_knowledge for the plan ID + procedure (e.g. "H1019-150 crowns", carriers/careplus-carecomplete-h1019-150, carriers/careplus-plans-florida-2027) when the attached PLAN DATA cell is vague or they asked 2027.

const API_BASE = "https://max-guru-production.up.railway.app";
const PROXY_URL = API_BASE + "/chat";
const UNLOCK_URL = API_BASE + "/auth/unlock";
// Set window.MAX_API_KEY via Netlify snippet / deploy inject (do not hardcode).
const MAX_API_KEY = (typeof window !== "undefined" && window.MAX_API_KEY) || "";
const ACCESS_TOKEN_KEY = "max_access_token";
const ACCESS_EMAIL_KEY = "max_access_email";
const WORKUPS_URL = API_BASE + "/workups";

function getAccessToken() {
  try { return sessionStorage.getItem(ACCESS_TOKEN_KEY) || ""; } catch (_) { return ""; }
}
function getAccessEmail() {
  try { return sessionStorage.getItem(ACCESS_EMAIL_KEY) || ""; } catch (_) { return ""; }
}
function setAccessEmail(email) {
  try {
    if (email) sessionStorage.setItem(ACCESS_EMAIL_KEY, email);
    else sessionStorage.removeItem(ACCESS_EMAIL_KEY);
  } catch (_) {}
}
function setAccessToken(token) {
  try {
    if (token) sessionStorage.setItem(ACCESS_TOKEN_KEY, token);
    else {
      sessionStorage.removeItem(ACCESS_TOKEN_KEY);
      sessionStorage.removeItem(ACCESS_EMAIL_KEY);
    }
  } catch (_) {}
}

function maxAuthHeaders() {
  const headers = { "Content-Type": "application/json" };
  if (MAX_API_KEY) headers["x-max-api-key"] = MAX_API_KEY;
  const access = getAccessToken();
  if (access) headers["x-max-access-token"] = access;
  return headers;
}

async function workupsRequest(method, path, body) {
  const response = await fetch(WORKUPS_URL + (path || ""), {
    method,
    headers: maxAuthHeaders(),
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (response.status === 401 && data.code === "access_required") {
    setAccessToken("");
    const err = new Error("access_required");
    err.code = "access_required";
    throw err;
  }
  if (!response.ok) {
    const err = new Error(data.error || "Workup request failed");
    err.status = response.status;
    throw err;
  }
  return data;
}

async function unlockMax(email, password) {
  const headers = maxAuthHeaders();
  const response = await fetch(UNLOCK_URL, {
    method: "POST",
    headers,
    body: JSON.stringify({ email, password }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const err = new Error(data.error || "Unlock failed");
    err.status = response.status;
    throw err;
  }
  if (data.token) setAccessToken(data.token);
  if (data.email) setAccessEmail(data.email);
  else if (email) setAccessEmail(email);
  return data;
}

const UI_QA = typeof location !== "undefined" ? new URLSearchParams(location.search) : new URLSearchParams();
const MOCK_DELAY_MS = Number(UI_QA.get("mockDelay") || 0);

async function askGuru(conversationHistory) {
  if (MOCK_DELAY_MS > 0) {
    await new Promise((resolve) => setTimeout(resolve, MOCK_DELAY_MS));
    return { text: "QA mock reply.", banners: [] };
  }
  const selection = selectPlansForAsk(conversationHistory);
  if (selection.needClarify) {
    return { text: selection.clarifyMessage, banners: [] };
  }
  const payload = {
    system: buildSystemPrompt(selection.plans),
    messages: conversationHistory,
  };
  const headers = maxAuthHeaders();
  const response = await fetch(PROXY_URL, {
    method: "POST",
    headers,
    body: JSON.stringify(payload),
  });
  const data = await response.json().catch(() => ({}));
  if (response.status === 401) {
    if (data.code === "access_required") {
      setAccessToken("");
      const err = new Error("access_required");
      err.code = "access_required";
      throw err;
    }
    return { text: "Backend auth isn't configured in this deploy (missing MAX_API_KEY inject). Ask admin to set the Netlify snippet.", banners: [] };
  }
  if (response.status === 429) {
    return { text: data.error || "Max is rate-limited to protect spend — try again shortly.", banners: data.banners || [] };
  }
  if (response.status === 402 && data.code === "daily_budget_reached") {
    return { text: data.error || "Max reached today’s budget. Say “OK go over” to continue today.", banners: data.banners || [] };
  }
  if (response.status === 413) {
    return { text: data.error || "That image is too large. Use PNG, JPEG, or WebP under 4MB each.", banners: data.banners || [] };
  }
  if (response.status === 503) {
    return { text: data.error || "Max's Grok backend isn't configured yet (missing XAI_API_KEY on Railway).", banners: [] };
  }
  if (response.status === 400 && data.code === "invalid_image") {
    const err = new Error(data.error || "Images must be PNG, JPEG, or WebP under 4MB.");
    err.code = "invalid_image";
    throw err;
  }
  if (!response.ok) {
    return { text: data.error || "I couldn't generate a response. Try again.", banners: data.banners || [] };
  }
  const textBlock = data.content && data.content.find((b) => b.type === "text");
  return {
    text: textBlock ? textBlock.text : "I couldn't generate a response. Try again.",
    banners: Array.isArray(data.banners) ? data.banners : [],
    toolResults: Array.isArray(data.toolResults) ? data.toolResults : [],
  };
}

// Lightweight, safe markdown-lite renderer -- handles just **bold** and
// [text](url), which is all Max actually needs. Deliberately NOT using a full
// markdown library + dangerouslySetInnerHTML here -- this builds real React
// elements instead, so there's no HTML-injection surface even though the
// content source (Claude's own responses) is trusted.
function renderMessageText(text) {
  const lines = text.split("\n");
  return lines.map((line, lineIdx) => {
    const parts = [];
    const pattern = /(\*\*(.+?)\*\*)|(\[([^\]]+)\]\(([^)]+)\))/g;
    let lastIndex = 0;
    let match;
    let key = 0;
    while ((match = pattern.exec(line)) !== null) {
      if (match.index > lastIndex) {
        parts.push(line.slice(lastIndex, match.index));
      }
      if (match[1]) {
        parts.push(<strong key={key++}>{match[2]}</strong>);
      } else if (match[3]) {
        parts.push(
          <a key={key++} href={match[5]} target="_blank" rel="noopener noreferrer"
             className="underline" style={{ color: "#ff1090" }}>
            {match[4]}
          </a>
        );
      }
      lastIndex = pattern.lastIndex;
    }
    if (lastIndex < line.length) {
      parts.push(line.slice(lastIndex));
    }
    return (
      <React.Fragment key={lineIdx}>
        {parts.length > 0 ? parts : line}
        {lineIdx < lines.length - 1 && <br />}
      </React.Fragment>
    );
  });
}
