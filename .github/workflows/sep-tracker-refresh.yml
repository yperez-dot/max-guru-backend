name: Refresh SEP tracker KB

on:
  schedule:
    # Mondays 14:00 UTC (~10am ET) — after typical HealthSpring weekly SEP mail
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh SEP files from live Hub tracker
        run: python3 scripts/refresh_sep_tracker.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- max-knowledge/hub/seps.json max-knowledge/hub/sep-tracker.md max-knowledge/hub/seps-by-state; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh SEP tracker KB from live Hub"
          title: "chore: refresh SEP tracker KB from live Hub"
          body: |
            Automated weekly refresh of **Max's** SEP knowledge pack from
            https://www.agentmedicarehub.com/sep-tracker-app.html

            This watcher is Max (Medicare guru), not Igor.
            Generated by `.github/workflows/sep-tracker-refresh.yml`.
            Railway also refreshes SEPs in-process every `SEP_REFRESH_HOURS` (default 24).
            See `WATCHER.md` and `MAX.md`.
          branch: chore/sep-tracker-auto-refresh
          delete-branch: true
